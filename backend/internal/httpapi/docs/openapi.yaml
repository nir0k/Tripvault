          $ref: "#/components/responses/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attachments/{attachmentID}/file:
    get:
      tags: [Documents]
      summary: Download a file attached to a place
      description: |
        The file exactly as it was uploaded, for any member of the trip. It is
        always sent as an attachment under its name, with `nosniff` and a
        sandbox policy, so it is never rendered under the application's origin.
      operationId: getAttachmentFile
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: The file as it was uploaded, with the type its bytes were recognised as.
          headers:
            Content-Disposition:
              description: "`attachment` with the file's name."
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

