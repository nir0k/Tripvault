        - $ref: "#/components/parameters/TransferID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{documentID}/legs:retry:
    post:
      tags: [Documents]
      summary: Ask again about the legs that became estimates
      description: |
        A trip planned before the routing service was configured, or while its
        daily limit was spent, holds straight-line estimates that nothing would
        ever ask about again: they are not `pending`, so `legs:calculate` leaves
        them alone. This takes the estimates whose reason may have passed -
        `provider_disabled`, `rate_limited`, `daily_limit`, `provider_error` -
        and asks the provider again.

        A leg with no road route between its points is left as it is, and so is
        a flight: neither becomes a road because a key was entered. At most 25
        legs are retried per call, and `estimated_legs` in the answer says
        whether any are left.
      operationId: retryEstimatedLegs
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{documentID}/legs:calculate:
    post:
      tags: [Documents]
      summary: Calculate waiting legs
      description: |
        A change to the order of elements, a mode or a position sends the
        affected legs to `pending`; the client calls this a moment after edits
        settle. At most 25 legs are calculated per call, and
        `pending_legs` in the answer tells whether to call again. Road legs come
        from the route cache or the provider; when neither can answer the leg
        becomes an `estimate` with the reason in `error`.
      operationId: calculateLegs
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/days/{dayID}:recalculate:
    post:
      tags: [Documents]
      summary: Recalculate a day's legs
      description: Calculates every leg of the day again, bypassing the route cache. Typed values stay.
      operationId: recalculateDay
      parameters:
        - $ref: "#/components/parameters/DayID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/legs/{legID}:
    patch:
      tags: [Documents]
      summary: Change a leg
      description: |
        Sets the mode, typed distance and time, cost or note. A typed value wins
        over the calculated one until it is set to `null` or `reset_manual`
        drops both. A new mode sends the leg back to `pending`.
      operationId: updateLeg
      parameters:
        - $ref: "#/components/parameters/LegID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLegRequest"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/legs/{legID}:recalculate:
    post:
      tags: [Documents]
      summary: Recalculate a leg
      description: Calculates the leg again, bypassing the route cache - the retry next to an estimate.
      operationId: recalculateLeg
      parameters:
        - $ref: "#/components/parameters/LegID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/legs/{legID}:alternatives:
    post:
      tags: [Documents]
      summary: List the routes a road leg could take
      description: |
        Asks the routing provider for up to three routes between the leg's
        ends, the best first by the leg's `route_preference`, for its editor to
        choose one. Nothing is stored and nothing is cached; the choice is sent
        to `POST /legs/{legID}:route`. A provider that offers no alternatives,
        and a long route the provider will not find others for, answer with one.
        The request counts against the routing limits like any other.
      operationId: listLegAlternatives
      parameters:
        - $ref: "#/components/parameters/LegID"
      responses:
        "200":
          description: The routes, the best first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            `validation_failed` for a leg that is not a road leg or lacks a
            position at one end; `no_route` when no road joins its ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`routing_disabled`, `routing_limited` or `routing_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/legs/{legID}:route:
    post:
      tags: [Documents]
      summary: Keep a chosen route for a road leg
      description: |
        Stores one of the routes `POST /legs/{legID}:alternatives` offered. The
        leg keeps it (`route_pinned`) until its ends, mode, preference or via
        points change, or it is recalculated. The line must run between the
        leg's ends, allowing for the provider snapping them to a road. Refused
        on a leg routed through via points, whose route those points decide.
      operationId: pinLegRoute
      parameters:
        - $ref: "#/components/parameters/LegID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Route"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`leg_changed`: the leg changed after the routes were listed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/legs/{legID}:google-link:
    post:
      tags: [Documents]
      summary: Read the via points of a Google Maps route link
      description: |
        Reads the points a route drawn in Google Maps passes through - the
        points its line was dragged through and the stops between its start
        and its end - for the leg to be routed through them. The link's own
        start and end are the leg's and are left out. A short link
        (`maps.app.goo.gl`) is expanded first by asking Google's own hosts where
        it leads; nothing else is requested. Nothing is stored: the points are
        saved with `PATCH /legs/{legID}` as `via`.
      operationId: readLegGoogleLink
      parameters:
        - $ref: "#/components/parameters/LegID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: The via points, in order; empty for a route with none between its ends.
          content:
            application/json:
              schema:
                type: object
                required: [via]
                properties:
                  via:
                    type: array
                    items:
                      $ref: "#/components/schemas/Point"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            `validation_failed`: `not_a_route_link` for text that is not a
            Google Maps route link, `no_points` for one that names no position,
            `too_many` for more than 25 points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`link_unreachable`: the short link could not be opened."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/users:
    get:
      tags: [Administration]
      summary: List accounts
      operationId: listUsers
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Administration]
      summary: Create an account
      description: The password is temporary; the owner must change it at the first sign-in.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/users/{userID}:
    patch:
      tags: [Administration]
      summary: Change an account
      description: |
        Renames, grants or withdraws administration, deactivates or reactivates.
        Deactivation ends every session of the account at once. A change that
        would leave no active administrator answers `409 last_admin`.
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/users/{userID}/reset-password:
    post:
      tags: [Administration]
      summary: Reset a password
      description: Sets a temporary password and ends every session of the account.
      operationId: resetPassword
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Reset.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/status:
    get:
      tags: [Administration]
      summary: Service state
      operationId: getStatus
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/previews:
    get:
      tags: [Administration]
      summary: Preview rendering progress
      description: >
        How the background rendering of photo previews is going. Work comes in
        waves - a batch of uploads, the walk over stored files at start-up or
        after a restore - and the progress describes the current wave, or the
        last one when none is running. Every figure is kept in memory and starts
        again when the service restarts, so the page may poll this cheaply.
      operationId: getPreviewStatus
      responses:
        "200":
          description: The progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/backup-configs:
    get:
      tags: [Backups]
      summary: List backup configurations
      operationId: listBackupConfigs
      responses:
        "200":
          description: The configurations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"
    post:
      tags: [Backups]
      summary: Create a backup configuration
      description: |
        A configuration with only a destination keeps the five newest archives
        and runs when somebody asks for it. A schedule is checked here rather
        than by the scheduler, so an expression that cannot be read is refused
        while the form is still open.
      operationId: createBackupConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupConfigInput"
      responses:
        "201":
          description: The stored configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"

  /api/v1/admin/backup-configs/{configID}:
    parameters:
      - $ref: "#/components/parameters/ConfigID"
    put:
      tags: [Backups]
      summary: Replace a backup configuration
      description: |
        A credential the body does not mention is kept, so a form that never
        showed a stored password need not send it back; an empty value removes
        it.
      operationId: updateBackupConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupConfigInput"
      responses:
        "200":
          description: The stored configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"
    delete:
      tags: [Backups]
      summary: Withdraw a backup configuration
      description: |
        The instruction stops; the archives it already wrote stay where they are
        and can still be listed and restored by naming this configuration.
      operationId: deleteBackupConfig
      responses:
        "204":
          description: Withdrawn.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"

  /api/v1/admin/backup-configs/{configID}/run:
    parameters:
      - $ref: "#/components/parameters/ConfigID"
    post:
      tags: [Backups]
      summary: Run a backup now
      description: |
        Answers as soon as the run is recorded and leaves the work going: an
        instance with a few thousand photographs takes minutes over a slow link.
        The answer is the run, still running; follow it at
        `/api/v1/admin/backup-runs/{runID}` until it says how it ended.
      operationId: runBackup
      responses:
        "202":
          description: The run, still working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This configuration is already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"

  /api/v1/admin/backup-runs:
    get:
      tags: [Backups]
      summary: Backup history
      description: |
        Every attempt, most recent first, whether it worked or not. The cursor is
        the offset of the next page.
      operationId: listBackupRuns
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the history.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupRun"
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"

  /api/v1/admin/backup-runs/{runID}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [Backups]
      summary: One backup run
      description: |
        Carries `progress` while the run is working in this process. A run left
        as `running` by a restart has none, which is how a reader tells the two
        apart: one is worth watching, the other will never finish.
      operationId: getBackupRun
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"

  /api/v1/admin/archives:
    get:
      tags: [Backups]
      summary: List the archives a restore can use
      description: |
        Archives never pass through the browser; a restore reads one back from
        where backups are kept. Without `config_id` this is the server's own
        backup directory, which is what a fresh instance whose volume holds
        archives has to offer. With it, it is that configuration's destination,
        an SFTP server typically; a withdrawn configuration still names where
        its archives went. The list is read from the destination itself, not
        from the history, which a fresh instance does not have.
      operationId: listArchives
      parameters:
        - name: config_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The archives, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Archive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: "`destination_unavailable`: the destination could not be reached."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"

  /api/v1/admin/restore:
    post:
      tags: [Backups]
      summary: Restore the service from an archive
      description: |
        Replaces everything: accounts, trips, plans, reports and files. That
        includes the sessions, so the administrator who asks for it is signed out
        by their own request unless their account is in the archive too.

        The archive is named as `/admin/archives` lists it and read from the
        same place. The answer is a restore run to follow at
        `/restore-runs/{restoreID}`. From the moment it starts until it ends the
        service is in maintenance: every other API request is cancelled or
        answered `503 restore_in_progress`, and no backup runs. In the
        background the archive is unpacked and every file and table checked
        against its recorded size and checksum before staged data is activated.

        An archive taken elsewhere is brought to the server on the host, into
        the backup volume, or restored before the service starts with
        `tripvault-backend --restore <archive>`.
      operationId: restoreInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archive, confirm]
              properties:
                config_id:
                  type: string
                  format: uuid
                  description: The configuration whose destination holds the archive; omitted for the server's disk.
                archive:
                  type: string
                  description: The archive's name at that destination.
                passphrase:
                  type: string
                  description: |
                    Opens an encrypted archive. Omitted, the configuration's own
                    passphrase is used; it is typed for an archive another
                    instance wrote.
                confirm:
                  type: string
                  enum: [replace-everything]
                  description: The consequence, typed out, rather than "yes".
      responses:
        "202":
          description: The restore was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreRun"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`archive_not_found`, or no such configuration."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`restore_running`: another restore is running; `backup_in_progress`: a backup is being written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`confirmation_required`, or `passphrase_required` for an encrypted archive with nothing to open it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "`destination_unavailable`: the destination could not be reached."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/BackupsUnavailable"

  /api/v1/restore-runs/{restoreID}:
    get:
      tags: [Backups]
      summary: Restore progress
      description: |
        Reports a background restore. The unguessable run identifier is enough
        to read this non-sensitive status, so polling survives replacement of
        the sessions table and the maintenance the restore runs in.
      operationId: getRestoreRun
      security: []
      parameters:
        - name: restoreID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current restore state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreRun"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportPDFPhotos:
      name: photos
      in: query
      description: "`false` renders the words without the photographs."
      schema:
        type: boolean
        default: true
    ReportPDFLanguage:
      name: lang
      in: query
      description: |
        The language the document's own labels are written in. A read-only link
        has no account behind it to take one from; anything but `ru` is written
        in English.
      schema:
        type: string
        enum: [en, ru]
    ReportPDFContentLanguage:
      name: content_lang
      in: query
      description: |
        The language the trip's own words are written in, when the report is
        translated into it. Omitted, it is the language of the labels; a
        language the report lacks, and every field nobody translated, is
        written in the original.
      schema:
        type: string
        enum: [en, ru]
    ReportPDFUnits:
      name: units
      in: query
      description: |
        What distances are written in. A read-only link has no account behind it
        to take it from; anything but `mi` is written in kilometres.
      schema:
        type: string
        enum: [km, mi]
    ConfigID:
      name: configID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunID:
      name: runID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaID:
      name: mediaID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreviewSize:
      name: size
      in: query
      required: false
      description: The width of the preview; one of the offered sizes.
      schema:
        type: integer
        enum: [160, 320, 640, 1280, 1920]
        default: 320
    TripID:
      name: tripID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentID:
      name: documentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DayID:
      name: dayID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemID:
      name: itemID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LegID:
      name: legID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransferID:
      name: transferID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StayID:
      name: stayID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseID:
      name: expenseID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackID:
      name: trackID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkID:
      name: linkID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareToken:
      name: X-Share-Token
      in: header
      required: true
      description: The token of a share link, as read from the fragment of its address.
      schema:
        type: string
    Lat:
      name: lat
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    Lng:
      name: lng
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
    Lang:
      name: lang
      in: query
      description: Language of the results; defaults to the reader's interface language.
      schema:
        type: string
        examples: [ru]
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string

  responses:
    TrackFile:
      description: The track file as it was uploaded.
      headers:
        Content-Disposition:
          description: "`attachment` with the original file name."
          schema:
            type: string
      content:
        application/gpx+xml:
          schema:
            type: string
            format: binary
        application/vnd.google-earth.kml+xml:
          schema:
            type: string
            format: binary
    Places:
      description: The places, best first.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Place"
    Document:
      description: The document.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Document"
    Budget:
      description: The trip's budget as it now stands.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Budget"
    DocumentChanged:
      description: The whole document after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Document"
    DaysWouldBeRemoved:
      description: |
        `days_would_be_removed`: the change removes days holding content.
        `details.days` lists them as `{document, position, date, title}`;
        repeat the request with confirmation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: The request was refused; see `code`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: "`invalid_request`: the body is missing, too large or not the documented JSON."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthorized`: no valid access token."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden` or `password_change_required`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: "`validation_failed`: `details.field` names the input, `details.reason` why."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReportPDF:
      description: The report as a PDF file.
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    BackupsUnavailable:
      description: |
        "`backups_unavailable`": this instance started without a usable backup
        directory, so nothing here can run until its configuration is fixed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: "`too_many_attempts`: wait `Retry-After` seconds."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [validation_failed]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string

    Health:
      type: object
      required: [status, build]
      properties:
        status:
          type: string
          const: ok
        build:
          $ref: "#/components/schemas/BuildInfo"

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unready]
        checks:
          type: object
          additionalProperties:
            type: string

    BuildInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string

    ClientConfig:
      type: object
      required: [version, locales, routing_enabled, routing_shortest, routing_alternatives, geocoding_enabled,
                 map_tile_url, map_attribution]
      properties:
        version:
          type: string
        locales:
          type: array
          description: Interface languages this build ships.
          items:
            type: string
        routing_enabled:
          type: boolean
          description: False when no routing provider is configured and road legs are estimates.
        routing_shortest:
          type: boolean
          description: Whether a road leg can be routed by the shortest distance rather than the fastest time.
        routing_alternatives:
          type: boolean
          description: Whether the provider offers other routes than its best for a leg to choose from.
        geocoding_enabled:
          type: boolean
          description: False when place search and reverse lookups are unavailable.
        map_tile_url:
          type: string
          description: Raster tile URL template with `{z}`, `{x}` and `{y}`.
          examples: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]
        map_attribution:
          type: string
          description: Attribution the map must show; may contain HTML links.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string

    Session:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, session_id, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        session_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, display_name, is_admin, is_active, must_change_password, locale, theme,
                 units, date_format, time_format, default_currency, has_avatar, avatar_updated_at,
                 last_login_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        locale:
          type: string
          description: Interface language; empty follows the browser.
        theme:
          type: string
          enum: [light, dark, auto]
        units:
          type: string
          enum: [km, mi]
          description: |
            How far this reader sees a distance in. Distances are stored and
            carried in metres whatever it says; two people on one trip may read
            the same trip in different units.
        date_format:
          type: string
          enum: [dmy, mdy]
          description: |
            Whether this reader sees the day or the month first. Like the units,
            it changes nothing that is stored.
        time_format:
          type: string
          enum: [h24, h12]
          description: Whether this reader sees 14:00 or 2:00 PM.
        default_currency:
          type: string
          description: ISO 4217 code proposed for new trips.
          pattern: "^[A-Z]{3}$"
        has_avatar:
          type: boolean
          description: Whether the account wears a picture; the bytes are fetched separately.
        avatar_updated_at:
          type: [string, "null"]
          format: date-time
          description: When the picture last changed, which is what makes a client fetch it again.
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [is_self]
          properties:
            is_self:
              type: boolean
              description: The reader's own account.

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 120
        locale:
          type: string
        theme:
          type: string
          enum: [light, dark, auto]
        units:
          type: string
          enum: [km, mi]
        date_format:
          type: string
          enum: [dmy, mdy]
        time_format:
          type: string
          enum: [h24, h12]
        default_currency:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    SessionItem:
      type: object
      required: [id, user_agent, created_at, last_used_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: The session making the request.

    CreateUserRequest:
      type: object
      required: [email, display_name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 8
          description: Temporary password.
        is_admin:
          type: boolean
          default: false

    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 120
        is_admin:
          type: boolean
        is_active:
          type: boolean

    ResetPasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          format: password
          minLength: 8
          description: Temporary password.

    Status:
      type: object
      required: [version, schema_version, users, routing, geocoding]
      properties:
        version:
          type: string
        schema_version:
          type: integer
        users:
          type: object
          required: [total, active, admins]
          properties:
            total:
              type: integer
            active:
              type: integer
            admins:
              type: integer
              description: Active administrators.
        routing:
          $ref: "#/components/schemas/ProviderStatus"
        geocoding:
          $ref: "#/components/schemas/ProviderStatus"

    PreviewStatus:
      type: object
      required: [background, active, total, done, started_at, queued, rendering, backfill, rendered, failed]
      properties:
        background:
          type: boolean
          description: False when previews are rendered only when first asked for.
        active:
          type: boolean
          description: Whether a wave of work is under way.
        total:
          type: integer
          description: Files handed to the background in the current or last wave.
        done:
          type: integer
          description: Files of that wave the background is done with, whatever came of them.
        started_at:
          type: [string, "null"]
          format: date-time
          description: When that wave began; null before the first one.
        queued:
          type: integer
          description: Uploads waiting for their previews.
        rendering:
          type: integer
          description: Files being decoded right now, for any reader or for the background.
        backfill:
          type: object
          required: [running, checked, total]
          description: The walk over stored files that renders the previews they lack.
          properties:
            running:
              type: boolean
            checked:
              type: integer
            total:
              type: integer
        rendered:
          type: integer
          description: Files whose previews were rendered since the service started.
        failed:
          type: integer
          description: Files that could not be rendered since the service started, such as damaged pictures.

    BackupConfigInput:
      type: object
      properties:
        destination_type:
          type: string
          enum: [local, sftp]
          default: local
        destination_params:
          type: object
          additionalProperties:
            type: string
          description: |
            What the destination needs and no credential ever: nothing for the
            local disk; `host`, `user`, and optionally `port`, `path` and
            `host_key` for SFTP. With no `host_key`, the key the server presents
            on the first connection is recorded and every later connection is
            held to it.
        secrets:
          type: object
          additionalProperties:
            type: string
          description: |
            Credentials typed into the form: `password`, `private_key` and
            `key_passphrase` for SFTP, `passphrase` for an encrypted archive. A
            name left out keeps what is stored; an empty value removes it. The
            values are sealed and never returned.
        encrypted:
          type: boolean
          default: false
          description: Locks each archive with age, using the stored passphrase.
        schedule_cron:
          type: string
          maxLength: 200
          description: |
            A five-field cron expression, or a descriptor such as `@daily`. Empty
            means the configuration runs only when somebody asks for it.
        retain_count:
          type: integer
          minimum: 0
          maximum: 365
          description: |
            How many of the newest archives to keep. Sent with neither this nor
            `retain_days`, a configuration keeps five.
        retain_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: |
            How many days an archive is kept. At most one of the two may be set;
            both zero keeps every archive.
        enabled:
          type: boolean
          default: true

    BackupConfig:
      type: object
      required:
        [id, destination_type, destination_params, stored_secrets, encrypted,
         schedule_cron, retain_count, retain_days, enabled, next_run_at]
      properties:
        id:
          type: string
          format: uuid
        destination_type:
          type: string
          enum: [local, sftp]
        destination_params:
          type: object
          additionalProperties:
            type: string
        stored_secrets:
          type: array
          items:
            type: string
          description: |
            The names of the credentials this configuration holds, so the
            interface can show which are set. The values never leave the server.
        encrypted:
          type: boolean
        schedule_cron:
          type: string
        retain_count:
          type: integer
        retain_days:
          type: integer
        enabled:
          type: boolean
        next_run_at:
          type: [string, "null"]
          format: date-time
          description: When the schedule next comes due; null without one.

    BackupProgress:
      type: object
      required: [stage, files_done, files_total, bytes_done, bytes_total]
      properties:
        stage:
          type: string
          enum: [connecting, reading, archiving, rotating]
        files_done:
          type: integer
        files_total:
          type: integer
        bytes_done:
          type: integer
          format: int64
        bytes_total:
          type: integer
          format: int64

    BackupRun:
      type: object
      required:
        [id, backup_config_id, started_at, finished_at, status, size_bytes,
         artifact, archive_held, error_message, progress]
      properties:
        id:
          type: string
          format: uuid
        backup_config_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [running, success, failed]
        size_bytes:
          type: [integer, "null"]
          format: int64
        artifact:
          type: string
          description: The archive this run wrote, empty when it wrote none.
        archive_held:
          type: boolean
          description: |
            Whether that archive is still at its destination. The name stays in
            the history after retention removes the file, so the two are not the
            same question.
        error_message:
          type: string
        progress:
          oneOf:
            - $ref: "#/components/schemas/BackupProgress"
            - type: "null"

    Archive:
      type: object
      description: One archive held at a destination.
      required: [name, size_bytes, written_at, encrypted]
      properties:
        name:
          type: string
          examples: ["tripvault_20260620T031500.000Z.tar.gz.age"]
        size_bytes:
          type: integer
          format: int64
        written_at:
          type: string
          format: date-time
        encrypted:
          type: boolean
          description: Read from the name; the archive's own bytes decide when it is restored.

    RestoreRun:
      type: object
      required:
        [id, status, stage, schema_version, tables, trips, files,
         error_code, error_message]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, success, failed]
        stage:
          type: string
          enum: [validating, staging, cutover, complete]
        schema_version:
          type: integer
          format: int64
          description: The migration the archive was taken at.
        tables:
          type: integer
        trips:
          type: integer
        files:
          type: integer
        error_code:
          type: string
        error_message:
          type: string

    TravelMode:
      type: string
      enum: [walk, car, bike, transit, flight, cable_car, other]
      description: |
        `walk`, `car`, `bike` and `transit` are routed on roads; `flight`,
        `cable_car` and `other` follow the straight line, and a flight or a
        cable car gets an estimated time until one is typed.

    Amount:
      type: string
      description: Non-negative decimal with at most two fractional digits, in the trip currency.
      pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
      examples: ["1240.50"]

    TripUser:
      type: object
      required: [id, display_name, email]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email

    Trip:
      type: object
      required: [id, kind, source_trip_id, title, summary, start_date, end_date, timezone, currency, travelers,
                 budget_amount, status, day_count, role, owner, plan_id, report_id, cover_media_id, cover_crop,
                 languages, translations, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [plan, report]
          description: |
            What the trip holds. A report is a trip of its own, with its own
            people, links, pictures and budget.
        source_trip_id:
          type: [string, "null"]
          format: uuid
          description: |
            The plan a report was copied from; null for a plan, for a report
            written from scratch, once that plan is deleted, and for a reader who
            cannot open that plan.
        title:
          type: string
        summary:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
          description: IANA time zone name.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        travelers:
          type: integer
        budget_amount:
          oneOf:
            - $ref: "#/components/schemas/Amount"
            - type: "null"
        status:
          type: string
          enum: [upcoming, ongoing, completed]
          description: Derived from the dates and today in the trip's time zone.
        day_count:
          type: integer
        role:
          type: string
          enum: [owner, editor, viewer]
          description: The reader's role.
        owner:
          $ref: "#/components/schemas/TripUser"
        plan_id:
          type: [string, "null"]
          format: uuid
          description: The plan a plan holds; null for a report.
        report_id:
          type: [string, "null"]
          format: uuid
          description: The report a report holds; null for a plan.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

        cover_media_id:
          type: [string, "null"]
          format: uuid
          description: The picture the trip is shown by, out of its own media.
        cover_crop:
          description: The part of the cover the trip is shown by; null means its middle.
          oneOf:
            - $ref: "#/components/schemas/CoverCrop"
            - type: "null"
        languages:
          $ref: "#/components/schemas/Languages"
        translations:
          type: object
          description: |
            A report's title and summary in its further languages: by
            language, then by field. A field missing here is read in the
            original.
          additionalProperties:
            type: object
            properties:
              title:
                type: string
              summary:
                type: string
    CoverCrop:
      type: object
      required: [x, y, w, h]
      additionalProperties: false
      description: |
        A frame inside a picture, as fractions of its width and height measured
        from the top left corner of the picture as it is shown upright. The
        file itself is never cut.
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        w:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        h:
          type: number
          exclusiveMinimum: 0
          maximum: 1

    Languages:
      type: array
      description: |
        The languages a report is written in: the original first, which its own
        fields hold, then the ones it is translated into. Always empty for a
        plan.
      items:
        type: string
        enum: [en, ru]
      uniqueItems: true
    CreateTripRequest:
      type: object
      required: [kind, title, start_date, end_date]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 2000
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
          default: UTC
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
        travelers:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        budget_amount:
          oneOf:
            - $ref: "#/components/schemas/Amount"
            - type: "null"
        kind:
          type: string
          enum: [plan, report]
          description: A plan, or a report written from scratch.
        languages:
          allOf:
            - $ref: "#/components/schemas/Languages"
          description: |
            A report's languages, the original first; omitted, a report is
            written in its author's language. A plan names none.

    UpdateTripRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 2000
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string
        travelers:
          type: integer
          minimum: 1
          maximum: 100
        budget_amount:
          oneOf:
            - $ref: "#/components/schemas/Amount"
            - type: "null"
        cover_media_id:
          type: [string, "null"]
          format: uuid
          description: The picture the trip is shown by, out of its own media; null takes it away.
        cover_crop:
          description: |
            The part of the cover shown; null means its middle. A new cover
            sent without a frame is shown by its middle.
          oneOf:
            - $ref: "#/components/schemas/CoverCrop"
            - type: "null"
        languages:
          allOf:
            - $ref: "#/components/schemas/Languages"
          minItems: 1
          description: |
            A report's languages, the original first. A language left out
            loses its translations. Refused on a plan.
        confirm:
          type: boolean
          default: false
          description: Accept that the new period removes days holding content.

    TripMember:
      type: object
      required: [user, role, created_at]
      properties:
        user:
          $ref: "#/components/schemas/TripUser"
        role:
          type: string
          enum: [owner, editor, viewer]
        created_at:
          type: string
          format: date-time

    AddTripMemberRequest:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [editor, viewer]

    UpdateTripMemberRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [editor, viewer]

    ClockTime:
      type: string
      description: Local time of day.
      pattern: "^[0-2][0-9]:[0-5][0-9]$"
      examples: ["09:00"]

    NullableAmount:
      oneOf:
        - $ref: "#/components/schemas/Amount"
        - type: "null"

    PlaceCategory:
      type: string
      enum: [sight, nature, museum, food, shopping, activity, transport, other]

    ActivityType:
      type: string
      description: What kind of activity an activity is; it decides its default length.
      enum: [hike, walk, bike, run, canyoning, climbing, via_ferrata, kayak, swim, ski, tour, other]

    CostCategory:
      type: string
      enum: [accommodation, transport, food, activities, shopping, other]

    ItemStatus:
      type: string
      description: |
        How a place of a report turned out. A plan keeps every place at
        `planned`. A place of a report is `visited` unless marked `skipped`:
        `planned` sent to a report is stored as `visited`, and a plan copied
        into a report arrives with every place visited. `unplanned` marks one
        added straight into the report.
      enum: [planned, visited, skipped, unplanned]

    TransferKind:
      type: string
      enum: [flight, train, bus, ferry, transfer, other]

    StayKind:
      type: string
      enum: [hotel, apartment, hostel, camping, friends, other]

    Schedule:
      type: object
      description: Minutes after the midnight the day starts on; may pass 1440.
      required: [arrival_minutes, departure_minutes, late]
      properties:
        arrival_minutes:
          type: integer
        departure_minutes:
          type: integer
        late:
          type: boolean
          description: The desired arrival time cannot be met.

    Item:
      type: object
      description: |
        A place, an activity, or a stay mark, which shows its stay's name and
        position. An activity lives in a day exactly like a place, with its
        position being where it starts; it also names its type.
      required: [id, day_id, position, kind, anchor, stay_id, name, category, activity_type, lat, lng, address, osm_ref,
                 description_md, url, desired_time, visit_minutes, is_optional, booking_ref,
                 planned_cost_amount, cost_per_person, cost_category, schedule,
                 status, story_md, actual_time, actual_end_time, rating, actual_cost_amount, difficulty,
                 source_item_id, track]
      properties:
        id:
          type: string
          format: uuid
        day_id:
          type: [string, "null"]
          format: uuid
        position:
          type: integer
        kind:
          type: string
          enum: [place, activity, stay_anchor]
        anchor:
          type: [string, "null"]
          enum: [morning, evening, null]
        stay_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/PlaceCategory"
        activity_type:
          description: Set on activities only.
          oneOf:
            - $ref: "#/components/schemas/ActivityType"
            - type: "null"
        lat:
          type: [number, "null"]
        lng:
          type: [number, "null"]
        address:
          type: string
        osm_ref:
          type: string
        description_md:
          type: string
        url:
          type: string
        desired_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        visit_minutes:
          type: integer
        is_optional:
          type: boolean
        booking_ref:
          type: string
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        cost_per_person:
          type: boolean
        cost_category:
          $ref: "#/components/schemas/CostCategory"
        status:
          $ref: "#/components/schemas/ItemStatus"
        story_md:
          type: string
          description: What happened here. Report only.
        actual_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
          description: When the place was really reached. Report only.
        actual_end_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
          description: When the place was left or the activity finished. Report only.
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Report only.
        actual_cost_amount:
          allOf:
            - $ref: "#/components/schemas/NullableAmount"
          description: What was really spent. Report only.
        difficulty:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: How hard an activity is, from 1 (very easy) to 5 (extreme). Always null on a place.
        source_item_id:
          type: [string, "null"]
          format: uuid
          description: The place of the plan this one was copied from.
        schedule:
          description: Set for elements of a day, null for unassigned places.
          oneOf:
            - $ref: "#/components/schemas/Schedule"
            - type: "null"

        media:
          type: array
          description: The place's pictures, in the order they were linked.
          items:
            $ref: "#/components/schemas/Media"
        cover_media_id:
          type: [string, "null"]
          format: uuid
          description: The picture the place is shown by, out of its own media.
        track:
          description: |
            The line the place or activity was recorded along in a report, or
            is meant to follow in a plan; null when it has none.
          oneOf:
            - $ref: "#/components/schemas/Track"
            - type: "null"
    Track:
      type: object
      description: |
        The line of a place or an activity, recorded in a report or planned
        in a plan. The file it came from
        is downloaded from `/tracks/{id}/file`.
      required: [id, original_name, format, distance_m, point_count, ascent_m, descent_m, geometry,
                 started_at, ended_at]
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
          description: The name of the file the line was imported from.
        format:
          type: string
          enum: [gpx, kml]
        distance_m:
          type: integer
          description: How far it went, measured over every point of that file.
        point_count:
          type: integer
          description: How many points the file held, before the line was thinned.
        ascent_m:
          type: [integer, "null"]
          description: |
            Height gained in metres, counting only changes of at least five
            metres so the wandering of a GPS height is left out; null when the
            file records no heights.
        descent_m:
          type: [integer, "null"]
          description: Height lost in metres, measured the same way; null without heights.
        geometry:
          type: string
          description: The thinned line, in the same encoded polyline format legs use.
        started_at:
          type: [string, "null"]
          format: date-time
          description: The earliest moment the file records; null when its points carry no time.
        ended_at:
          type: [string, "null"]
          format: date-time
          description: The latest moment the file records; null when its points carry no time.
    Media:
      type: object
      required: [id, trip_id, original_name, mime, size, width, height, taken_at, lat, lng, is_private,
                 is_favorite, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        original_name:
          type: string
          description: The name the file was uploaded under.
        mime:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          format: int64
          description: The size of the stored file in bytes.
        width:
          type: integer
          description: The width in pixels, as the picture is shown.
        height:
          type: integer
        taken_at:
          type: string
          format: date-time
          nullable: true
          description: When the camera took the picture, from its own metadata.
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        is_private:
          type: boolean
          description: Private files stay out of read-only links that were not given them.
        is_favorite:
          type: boolean
          description: |
            In the gallery of a day or a place, whether this is one of the pictures
            the report shows there; in the trip's own list of files, whether the file
            is a favourite anywhere in the report.
        status:
          type: string
          enum: [ready, processing, failed]
        created_at:
          type: string
          format: date-time
    SetMediaLinksRequest:
      type: object
      required: [target_type, target_id, media_ids]
      properties:
        target_type:
          type: string
          enum: [trip, day, item]
        target_id:
          type: string
          format: uuid
        media_ids:
          type: array
          description: The files to show, in the order they should appear; an empty list clears the gallery.
          items:
            type: string
            format: uuid
        favorite_media_ids:
          type: array
          maxItems: 7
          description: |
            Which of the files the report shows for this day or place, out of the
            gallery above. Leaving the field out keeps the ones already marked, so
            a reorder need not repeat them; an empty list marks none. Only the days
            and places of a report have favourites.
          items:
            type: string
            format: uuid
    SetMediaFavoritesRequest:
      type: object
      required: [media_ids, favorite]
      properties:
        media_ids:
          type: array
          description: The files to mark, wherever they hang in the report.
          items:
            type: string
            format: uuid
        favorite:
          type: boolean
          description: True to show them in the report, false to stop showing them.
    Day:
      type: object
      required: [id, position, date, title, notes_md, start_time, default_mode, timezone, morning_anchor,
                 evening_anchor, no_overnight, items, summary]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        date:
          type: [string, "null"]
          format: date
        title:
          type: string
        notes_md:
          type: string
        start_time:
          $ref: "#/components/schemas/ClockTime"
        default_mode:
          description: Null inherits the trip's.
          oneOf:
            - $ref: "#/components/schemas/TravelMode"
            - type: "null"
        timezone:
          type: [string, "null"]
          description: Null inherits the trip's.
        morning_anchor:
          type: boolean
          description: Whether the stay of the previous night opens the day.
        evening_anchor:
          type: boolean
          description: Whether the stay of the coming night closes the day.
        no_overnight:
          type: boolean
          description: The coming night is spent without a stay.
        items:
          type: array
          description: Morning mark, places, evening mark.
          items:
            $ref: "#/components/schemas/Item"
        legs:
          type: array
          description: The leg from each element to the next, in order.
          items:
            $ref: "#/components/schemas/Leg"
        summary:
          type: object
          required: [visit_minutes, travel_minutes, distance_m, by_mode, unknown_travel, pending_legs,
                     estimated_legs, end_minutes, planned_cost]
          properties:
            visit_minutes:
              type: integer
            travel_minutes:
              type: integer
            distance_m:
              type: integer
            by_mode:
              type: array
              items:
                type: object
                required: [mode, distance_m, duration_s]
                properties:
                  mode:
                    $ref: "#/components/schemas/TravelMode"
                  distance_m:
                    type: integer
                  duration_s:
                    type: integer
            unknown_travel:
              type: boolean
              description: Some leg has no travel time, so the day ends later than shown.
            pending_legs:
              type: integer
            estimated_legs:
              type: integer
              description: Legs of this day holding an estimate worth asking about again.
            end_minutes:
              type: integer
            planned_cost:
              allOf:
                - $ref: "#/components/schemas/Amount"
              description: What the day plans to spend, optional places included.
            actual_cost:
              allOf:
                - $ref: "#/components/schemas/Amount"
              description: What the day really cost; zero outside a report.

        media:
          type: array
          description: The day's pictures, in the order they were linked.
          items:
            $ref: "#/components/schemas/Media"
        cover_media_id:
          type: [string, "null"]
          format: uuid
          description: The picture the day is shown by, out of its own media.
    Stay:
      type: object
      required: [id, name, kind, address, lat, lng, check_in_date, check_in_time, check_out_date, check_out_time,
                 booking_ref, url, contacts, notes_md, planned_cost_amount, actual_cost_amount, nights,
                 price_per_night, source_stay_id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/StayKind"
        address:
          type: string
        lat:
          type: [number, "null"]
        lng:
          type: [number, "null"]
        check_in_date:
          type: string
          format: date
        check_in_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        check_out_date:
          type: string
          format: date
        check_out_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        booking_ref:
          type: string
        url:
          type: string
        contacts:
          type: string
        notes_md:
          type: string
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        actual_cost_amount:
          allOf:
            - $ref: "#/components/schemas/NullableAmount"
          description: Report only.
        nights:
          type: integer
        price_per_night:
          $ref: "#/components/schemas/NullableAmount"
        source_stay_id:
          type: [string, "null"]
          format: uuid

    Transfer:
      type: object
      description: A booked journey between two places, by the date it departs.
      required: [id, kind, name, from_name, from_address, from_lat, from_lng, to_name, to_address, to_lat, to_lng,
                 departure_date, departure_time, arrival_date, arrival_time, booking_ref, url, notes_md,
                 planned_cost_amount, cost_per_person, actual_cost_amount, source_transfer_id]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TransferKind"
        name:
          type: string
          description: The carrier or the number, such as "Icelandair FI 204"; may be empty.
        from_name:
          type: string
          maxLength: 200
        from_address:
          type: string
        from_lat:
          type: [number, "null"]
        from_lng:
          type: [number, "null"]
        to_name:
          type: string
          maxLength: 200
        to_address:
          type: string
        to_lat:
          type: [number, "null"]
        to_lng:
          type: [number, "null"]
        departure_date:
          type: string
          format: date
        departure_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        arrival_date:
          type: [string, "null"]
          format: date
          description: |
            Null when the transfer arrives on the day it departs. At most one
            day before the departure date, which a flight west over the date
            line may land on.
        arrival_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        booking_ref:
          type: string
        url:
          type: string
        notes_md:
          type: string
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        cost_per_person:
          type: boolean
          description: The amounts are per traveller and multiplied in the budget.
        actual_cost_amount:
          allOf:
            - $ref: "#/components/schemas/NullableAmount"
          description: Report only.
        source_transfer_id:
          type: [string, "null"]
          format: uuid

    Document:
      type: object
      required: [id, trip_id, kind, source_document_id, intro_md, summary_md, days, unassigned, stays, transfers,
                 expenses, nights, stay_summary, pending_legs, estimated_legs, totals, translations, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [plan, report]
        source_document_id:
          type: [string, "null"]
          format: uuid
          description: The plan a report was copied from.
        intro_md:
          type: string
          description: The words before the days.
        summary_md:
          type: string
          description: The words after them.
        days:
          type: array
          items:
            $ref: "#/components/schemas/Day"
        unassigned:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        stays:
          type: array
          description: By check-in date.
          items:
            $ref: "#/components/schemas/Stay"
        transfers:
          type: array
          description: By departure date and time.
          items:
            $ref: "#/components/schemas/Transfer"
        expenses:
          type: array
          description: Costs tied to no place, stay or leg, oldest first.
          items:
            $ref: "#/components/schemas/Expense"
        nights:
          type: array
          description: The nights of a trip with dates, from its first day to the night before its last.
          items:
            type: object
            required: [date, stay_ids, no_overnight, missing]
            properties:
              date:
                type: string
                format: date
              stay_ids:
                type: array
                description: More than one is an overlap.
                items:
                  type: string
                  format: uuid
              no_overnight:
                type: boolean
              missing:
                type: boolean
                description: No stay and not marked as spent without one.
        pending_legs:
          type: integer
          description: Legs waiting for a calculation; call `legs:calculate` while it is above zero.
        estimated_legs:
          type: integer
          description: |
            Legs holding an estimate the provider could be asked about again;
            call `legs:retry` while it is above zero.
        totals:
          oneOf:
            - $ref: "#/components/schemas/ReportTotals"
            - type: "null"
          description: A report's figures for its reading mode; null on a plan.
        translations:
          type: object
          description: |
            A report's words in its further languages: by language, then by
            the identifier of the element translated (the document, a day, a
            stay, a transfer, a place or a leg), then by field. A field missing here is read
            in the original. Empty on a plan.
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: string
        stay_summary:
          type: object
          required: [nights, cost, average_per_night]
          properties:
            nights:
              type: integer
            cost:
              $ref: "#/components/schemas/Amount"
            average_per_night:
              $ref: "#/components/schemas/NullableAmount"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportTotals:
      type: object
      description: |
        The figures the reading mode of a report opens with, derived on every
        read. `planned_cost` is the snapshot the report carries and
        `actual_cost` what was really spent.
      required: [days, nights, places, distance_m, by_mode, planned_cost, actual_cost, difference, rated,
                 average_rating]
      properties:
        days:
          type: integer
        nights:
          type: integer
          description: Nights covered by a stay.
        places:
          type: object
          required: [planned, visited, skipped, unplanned, total]
          properties:
            planned:
              type: integer
              description: Not marked one way or the other yet.
            visited:
              type: integer
            skipped:
              type: integer
            unplanned:
              type: integer
            total:
              type: integer
        distance_m:
          type: integer
        by_mode:
          type: array
          items:
            type: object
            required: [mode, distance_m, duration_s]
            properties:
              mode:
                $ref: "#/components/schemas/TravelMode"
              distance_m:
                type: integer
              duration_s:
                type: integer
        planned_cost:
          $ref: "#/components/schemas/Amount"
        actual_cost:
          $ref: "#/components/schemas/Amount"
        difference:
          type: string
          description: Actual minus planned; negative when less was spent.
          pattern: "^-?[0-9]{1,12}(\\.[0-9]{1,2})?$"
        rated:
          type: integer
          description: Places carrying a rating.
        average_rating:
          type: [number, "null"]

    DayRequest:
      type: object
      additionalProperties: false
      description: Omitted fields keep their value.
      properties:
        title:
          type: string
          maxLength: 200
        notes_md:
          type: string
          maxLength: 20000
        start_time:
          $ref: "#/components/schemas/ClockTime"
        default_mode:
          oneOf:
            - $ref: "#/components/schemas/TravelMode"
            - type: "null"
        timezone:
          type: [string, "null"]
        morning_anchor:
          type: boolean
        evening_anchor:
          type: boolean
        no_overnight:
          type: boolean

    CreateDayRequest:
      allOf:
        - $ref: "#/components/schemas/DayRequest"
        - type: object
          properties:
            position:
              type: integer
              description: Insert before the day now at this position; omitted appends.

    ReorderDaysRequest:
      type: object
      required: [day_ids]
      additionalProperties: false
      properties:
        day_ids:
          type: array
          description: Every day of the document, once, in the new order.
          items:
            type: string
            format: uuid

    PlaceRequest:
      type: object
      additionalProperties: false
      description: |
        Omitted fields keep their value; null clears coordinates, desired time
        and cost. A new place needs a name; its visit time defaults to its
        category's and its cost category follows the place category. `kind`
        makes it an activity, whose visit time defaults to its type's; it may
        be changed later, and a place forgets its activity type and difficulty.
        In a report, storing a place puts the places of its day in the order
        of their `actual_time`: the timed ones are sorted into the positions
        the timed ones held, and a place without a time keeps its position.
      properties:
        kind:
          type: string
          enum: [place, activity]
        activity_type:
          $ref: "#/components/schemas/ActivityType"
        name:
          type: string
          maxLength: 200
        category:
          $ref: "#/components/schemas/PlaceCategory"
        lat:
          type: [number, "null"]
        lng:
          type: [number, "null"]
        address:
          type: string
        osm_ref:
          type: string
        description_md:
          type: string
          maxLength: 20000
        url:
          type: string
          description: An http or https address, or empty.
        desired_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        visit_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        is_optional:
          type: boolean
        booking_ref:
          type: string
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        cost_per_person:
          type: boolean
        cost_category:
          $ref: "#/components/schemas/CostCategory"
        status:
          $ref: "#/components/schemas/ItemStatus"
        story_md:
          type: string
          maxLength: 20000
        actual_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        actual_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        actual_end_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        difficulty:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Activities only; a place drops it.

    CreatePlaceRequest:
      allOf:
        - $ref: "#/components/schemas/PlaceRequest"
        - type: object
          required: [name]
          properties:
            position:
              type: integer
              description: Insert before the place now at this position; omitted appends.

    PlaceTarget:
      type: object
      additionalProperties: false
      properties:
        to_day_id:
          type: [string, "null"]
          format: uuid
          description: The target day; null is the unassigned list of a plan.
        position:
          type: integer
          description: Position in the target list; omitted or out of range appends.

    MovePlaceRequest:
      allOf:
        - $ref: "#/components/schemas/PlaceTarget"
        - type: object
          required: [item_id]
          properties:
            item_id:
              type: string
              format: uuid

    StayRequest:
      type: object
      additionalProperties: false
      description: Omitted fields keep their value. A new stay needs a name and both dates.
      properties:
        name:
          type: string
          maxLength: 200
        kind:
          $ref: "#/components/schemas/StayKind"
        address:
          type: string
        lat:
          type: [number, "null"]
        lng:
          type: [number, "null"]
        check_in_date:
          type: string
          format: date
        check_in_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        check_out_date:
          type: string
          format: date
          description: After the check-in date.
        check_out_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        booking_ref:
          type: string
        url:
          type: string
        contacts:
          type: string
        notes_md:
          type: string
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        actual_cost_amount:
          allOf:
            - $ref: "#/components/schemas/NullableAmount"
          description: Report only.

    TransferRequest:
      type: object
      additionalProperties: false
      description: Omitted fields keep their value. A new transfer needs both names and the departure date.
      properties:
        kind:
          $ref: "#/components/schemas/TransferKind"
        name:
          type: string
          maxLength: 200
        from_name:
          type: string
          maxLength: 200
        from_address:
          type: string
        from_lat:
          type: [number, "null"]
        from_lng:
          type: [number, "null"]
        to_name:
          type: string
          maxLength: 200
        to_address:
          type: string
        to_lat:
          type: [number, "null"]
        to_lng:
          type: [number, "null"]
        departure_date:
          type: string
          format: date
        departure_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        arrival_date:
          type: [string, "null"]
          format: date
          description: |
            Null when the transfer arrives on the day it departs. At most one
            day before the departure date, which a flight west over the date
            line may land on.
        arrival_time:
          oneOf:
            - $ref: "#/components/schemas/ClockTime"
            - type: "null"
        booking_ref:
          type: string
        url:
          type: string
        notes_md:
          type: string
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        cost_per_person:
          type: boolean
          description: The amounts are per traveller and multiplied in the budget.
        actual_cost_amount:
          allOf:
            - $ref: "#/components/schemas/NullableAmount"
          description: Report only.

    ShareLink:
      type: object
      description: A link as its owner sees it afterwards, without its token.
      required: [id, label, include_private_media, expires_at, last_used_at, use_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: The owner's own note, such as “For my parents”.
        include_private_media:
          type: boolean
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the link stops working; null never expires.
        last_used_at:
          type: [string, "null"]
          format: date-time
        use_count:
          type: integer
          description: How many times the link has been opened.
        created_at:
          type: string
          format: date-time

    CreatedShareLink:
      allOf:
        - $ref: "#/components/schemas/ShareLink"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                32 random bytes in base64url. Shown only here, and never again.
                The address to hand out is `<origin>/s#token=<token>`, built by
                the client from its own origin.
              examples: ["Yk9uZm9yZ2V0dGFibGVyYW5kb21ieXRlc2hlcmU"]

    CreateShareLinkRequest:
      type: object
      additionalProperties: false
      description: |
        Every field is optional; the default hides private media and never
        expires. A link opens the trip's one document, its plan or its report.
      properties:
        label:
          type: string
          maxLength: 200
        include_private_media:
          type: boolean
          default: false
        expires_at:
          type: [string, "null"]
          format: date-time
          description: An RFC 3339 timestamp in the future; null or omitted never expires.

    Shared:
      type: object
      description: What a share token opens.
      required: [trip, label, kind, include_private_media]
      properties:
        trip:
          type: object
          description: |
            The trip as the link shows it: nothing about the people with access
            or the accounts behind them, and not the trip's own budget.
          required: [title, summary, start_date, end_date, timezone, currency, travelers, status, day_count,
                     owner_name, languages, translations]
          properties:
            title:
              type: string
            summary:
              type: string
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            timezone:
              type: string
            currency:
              type: string
            travelers:
              type: integer
            status:
              type: string
              enum: [upcoming, ongoing, completed]
            day_count:
              type: integer
            owner_name:
              type: string
            languages:
              $ref: "#/components/schemas/Languages"
            translations:
              type: object
              description: The report's title and summary in its further languages, by language, then by field.
              additionalProperties:
                type: object
                additionalProperties:
                  type: string
        label:
          type: string
        kind:
          type: string
          enum: [plan, report]
          description: What the trip holds, and so what the link opens.
        include_private_media:
          type: boolean

    Expense:
      type: object
      description: |
        A cost that belongs to no place, stay or leg. `day_id` is null for an
        expense of the whole trip. `actual_amount` and `spent_on` stay empty in
        a plan.
      required: [id, day_id, category, planned_amount, actual_amount, spent_on, note]
      properties:
        id:
          type: string
          format: uuid
        day_id:
          type: [string, "null"]
          format: uuid
        category:
          $ref: "#/components/schemas/CostCategory"
        planned_amount:
          $ref: "#/components/schemas/NullableAmount"
        actual_amount:
          $ref: "#/components/schemas/NullableAmount"
        spent_on:
          type: [string, "null"]
          format: date
        note:
          type: string

    ExpenseRequest:
      type: object
      additionalProperties: false
      description: |
        Omitted fields keep their value. A null `day_id` moves the expense to
        the trip as a whole. An expense needs at least one amount.
      properties:
        day_id:
          type: [string, "null"]
          format: uuid
          description: A day of the same document.
        category:
          $ref: "#/components/schemas/CostCategory"
        planned_amount:
          $ref: "#/components/schemas/NullableAmount"
        actual_amount:
          $ref: "#/components/schemas/NullableAmount"
        spent_on:
          type: [string, "null"]
          format: date
        note:
          type: string
          maxLength: 500

    Budget:
      type: object
      description: |
        Every amount is in the trip's currency. `planned` is what the plan
        commits to, the places marked optional included; only `unassigned`, the
        places not on a day yet, is reported separately so it never inflates it.
        `planned` is the sum of the days, `stays`, `transfers` and `untied`.

        A report's budget carries the same planned amounts - the snapshot it was
        copied with - and `actual` beside each of them. There the overall budget
        is measured against `actual`, since that is what was spent.
      required: [kind, document_id, currency, travelers, budget_amount, planned, unassigned, stays,
                 transfers, untied, actual, per_person, remaining, used_percent, categories, days, entries]
      properties:
        kind:
          type: string
          enum: [plan, report]
        document_id:
          type: [string, "null"]
          format: uuid
          description: The document the figures come from.
        currency:
          type: string
        travelers:
          type: integer
        budget_amount:
          $ref: "#/components/schemas/NullableAmount"
        planned:
          $ref: "#/components/schemas/Amount"
        unassigned:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The places that are not on a day yet.
        stays:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The part of `planned` spent on accommodation.
        transfers:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The part of `planned` spent on transfers.
        untied:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The part of `planned` from expenses of the whole trip.
        actual:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Everything a report records as spent; `0.00` in a plan.
        per_person:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The spending over the travellers - `planned` in a plan, `actual` in a report.
        remaining:
          oneOf:
            - type: string
              description: The budget minus the spending; negative when overspent.
              pattern: "^-?[0-9]{1,12}(\\.[0-9]{1,2})?$"
            - type: "null"
        used_percent:
          type: [integer, "null"]
          description: |
            The share of the budget the spending takes up, for a bar; null
            without a budget, and above 100 when it does not fit.
        categories:
          type: array
          description: Every category, accommodation and transport first.
          items:
            type: object
            required: [category, planned, actual]
            properties:
              category:
                $ref: "#/components/schemas/CostCategory"
              planned:
                $ref: "#/components/schemas/Amount"
              actual:
                $ref: "#/components/schemas/Amount"
        days:
          type: array
          description: The document's days, in order.
          items:
            type: object
            required: [day_id, position, date, planned, actual]
            properties:
              day_id:
                type: string
                format: uuid
              position:
                type: integer
              date:
                type: [string, "null"]
                format: date
              planned:
                $ref: "#/components/schemas/Amount"
              actual:
                $ref: "#/components/schemas/Amount"
        entries:
          type: array
          description: |
            The individual costs, day by day and unassigned places last, for the
            expense list and its filters.
          items:
            type: object
            required: [kind, id, label, category, day_id, amount, unit_amount, per_person, is_optional, unassigned,
                       actual_amount]
            properties:
              kind:
                type: string
                enum: [place, stay, transfer, leg, expense]
              id:
                type: string
                format: uuid
                description: The place, stay, transfer, leg or expense carrying the cost.
              label:
                type: string
              category:
                $ref: "#/components/schemas/CostCategory"
              day_id:
                type: [string, "null"]
                format: uuid
              amount:
                allOf:
                  - $ref: "#/components/schemas/Amount"
                description: What the cost comes to for the whole group.
              unit_amount:
                allOf:
                  - $ref: "#/components/schemas/Amount"
                description: The amount as it was typed.
              per_person:
                type: boolean
              is_optional:
                type: boolean
                description: A place its day may skip; it counts towards `planned` all the same.
              unassigned:
                type: boolean
                description: A place with no day; left out of every total but `unassigned`.
              actual_amount:
                allOf:
                  - $ref: "#/components/schemas/NullableAmount"
                description: |
                  What was really spent for the whole group, in a report; null in
                  a plan and where nothing was entered. A cost entered only as
                  spent has an `amount` of `0.00`.

    Leg:
      type: object
      description: |
        The journey between two neighbouring elements of a day. A day that does
        not open with a stay mark also has one in from the last element of the
        nearest earlier day that has any, listed first among the day's legs; its
        `from_item_id` is then an element of that earlier day.
      required: [id, from_item_id, to_item_id, mode, distance_m, duration_s, calculated_distance_m,
                 calculated_duration_s, manual_distance, manual_duration, geometry, source, error, calculated_at,
                 planned_cost_amount, actual_cost_amount, note, route_preference, via, route_pinned]
      properties:
        id:
          type: string
          format: uuid
        from_item_id:
          type: string
          format: uuid
        to_item_id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/TravelMode"
        distance_m:
          type: [integer, "null"]
          description: The distance the plan uses - typed if set, else calculated.
        duration_s:
          type: [integer, "null"]
          description: The time the plan uses; null for an "other" leg nobody timed.
        calculated_distance_m:
          type: [integer, "null"]
        calculated_duration_s:
          type: [integer, "null"]
        manual_distance:
          type: boolean
        manual_duration:
          type: boolean
        geometry:
          type: string
          description: Encoded polyline, precision 5; empty until calculated.
        source:
          type: string
          enum: [pending, provider, straight_line, estimate, missing_coordinates]
          description: |
            `provider` follows roads (a `transit` leg follows the car route);
            `straight_line` is the great circle of flights, cable cars and
            other legs;
            `estimate` is a scaled straight line when the provider could not
            answer; `missing_coordinates` cannot be calculated.
        error:
          type: [string, "null"]
          enum: [provider_disabled, rate_limited, daily_limit, no_route, provider_error, null]
          description: Why an estimate was used.
        calculated_at:
          type: [string, "null"]
          format: date-time
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        actual_cost_amount:
          allOf:
            - $ref: "#/components/schemas/NullableAmount"
          description: Report only.
        note:
          type: string
        route_preference:
          $ref: "#/components/schemas/RoutePreference"
        via:
          type: array
          maxItems: 25
          description: The points a road route passes through, in order; empty for a route from end to end.
          items:
            $ref: "#/components/schemas/Point"
        route_pinned:
          type: boolean
          description: |
            A route chosen among the alternatives, kept until the leg's ends,
            mode, preference or via points change or it is recalculated.

    RoutePreference:
      type: string
      enum: [fastest, shortest]
      description: |
        What a road route is optimised for. A provider that routes only by
        time (OSRM) answers every leg with its fastest route.

    Point:
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    Route:
      type: object
      required: [distance_m, duration_s, geometry]
      additionalProperties: false
      properties:
        distance_m:
          type: integer
          minimum: 0
        duration_s:
          type: integer
          minimum: 0
        geometry:
          type: string
          description: Encoded polyline, precision 5.

    UpdateLegRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/TravelMode"
        distance_m:
          type: [integer, "null"]
          minimum: 0
          description: Typed distance in metres; null returns to the calculated one.
        duration_s:
          type: [integer, "null"]
          minimum: 0
          description: Typed time in seconds; null returns to the calculated one.
        planned_cost_amount:
          $ref: "#/components/schemas/NullableAmount"
        actual_cost_amount:
          allOf:
            - $ref: "#/components/schemas/NullableAmount"
          description: Report only.
        note:
          type: string
          maxLength: 500
        reset_manual:
          type: boolean
          description: Drop both typed values.
        route_preference:
          $ref: "#/components/schemas/RoutePreference"
        via:
          type: [array, "null"]
          maxItems: 25
          description: |
            Replaces the points a road route passes through; null or an empty
            list routes it from end to end. Ignored on a leg that is not
            routed on roads. A change sends the leg back to pending.
          items:
            $ref: "#/components/schemas/Point"

    ProviderStatus:
      type: object
      required: [provider, configured, last_success_at, last_error_at, requests_24h, errors_24h, daily_limit,
                 cache_entries, cache_hits]
      properties:
        provider:
          type: string
        configured:
          type: boolean
          description: Whether an API key is set.
        last_success_at:
          type: [string, "null"]
          format: date-time
        last_error_at:
          type: [string, "null"]
          format: date-time
        requests_24h:
          type: integer
        errors_24h:
          type: integer
        daily_limit:
          type: integer
          description: The service's own daily limit, kept below the provider's.
        cache_entries:
          type: integer
        cache_hits:
          type: integer

    Place:
      type: object
      required: [name, label, lat, lng, layer, country, ref]
      properties:
        name:
          type: string
        label:
          type: string
          description: The name with its region, for a list of choices.
        lat:
          type: number
        lng:
          type: number
        layer:
          type: string
          description: The kind of result, such as venue, address or locality.
        country:
          type: string
        ref:
          type: string
          description: The result's identifier at its source; store it as a place's osm_ref.
