  /api/v1/items/{itemID}/stops:
    post:
      tags: [Documents]
      summary: Add a stop along the line of an activity
      description: |
        A café, a rest, a view or a spring along the line of an activity. The
        point given is moved onto the nearest stretch of the line, and how far
        along the line it lies (`distance_m`) and the slopes of the way there
        (`grades_to`) are measured from the line's own file. An activity
        without a line answers `422` with reason `no_track`; an activity holds
        at most 50 stops (`too_many_stops`). A stop costs like a place and is
        counted in its activity's day; `actual_time` and `actual_cost_amount`
        belong to a report (`report_only`). Owners and editors may.
      operationId: createStop
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StopRequest"
                - required: [lat, lng]
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
