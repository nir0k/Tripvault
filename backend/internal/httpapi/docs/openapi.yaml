  /api/v1/items/{itemID}/track:
    post:
      tags: [Documents]
      summary: Import the line of an activity
      description: |
        A multipart upload with one `file` part holding a GPX or KML export of
        a hike, a walk or a descent that makes up an activity: in a report the
        recording of what was travelled, in a plan the route meant to be taken.
        A place answers `422` with reason `activity_only`; turning an activity
        into a place removes its line. It replaces whatever the place had. The length, the height
        gained and lost and a thinned line are read from the file, and the file
        itself is kept to be downloaded from `/tracks/{trackID}/file`. The
        length is added to the legs of the day, as distance covered inside the
        activity rather than between places. A day has no recording of its own.
        An activity with no position takes the line's first point. In a report,
        when the file records time, an activity with no `actual_time` or
        `actual_end_time` takes the recording's first and last moment in the
        trip's time zone. A position or a time already set is kept. A report
        copied from a plan starts with the plan's routes, files included.
      operationId: importItemTrack
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Documents]
      summary: Remove the recorded line of a place or an activity
      operationId: deleteItemTrack
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tracks/{trackID}/file:
    get:
