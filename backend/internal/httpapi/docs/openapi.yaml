        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripMember"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Trips]
      summary: Remove a member
      description: Owner only.
      operationId: removeTripMember
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripID}/share-links:
    get:
      tags: [Sharing]
      summary: List the trip's links
      description: |
        Owner only. Revoked links are left out, and no link shows its token:
        that is returned once, when the link is created.
      operationId: listShareLinks
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          description: The trip's live links, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShareLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Sharing]
      summary: Create a link
      description: |
        Owner only. The answer is the only place the token and the full address
        ever appear; neither can be read again.
      operationId: createShareLink
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkRequest"
      responses:
        "201":
          description: The link, with its token shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedShareLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/share-links/{linkID}:
    delete:
      tags: [Sharing]
      summary: Revoke a link
      description: |
        Owner only. The link stops opening the trip at once, for everybody who
        has it. A link of a trip the reader does not own answers `404`.
      operationId: revokeShareLink
      parameters:
        - $ref: "#/components/parameters/LinkID"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared:
    get:
      tags: [Sharing]
      summary: Read what a link opens
      description: |
        Authenticated by `X-Share-Token` alone, with no account. A missing,
        unknown, revoked or expired token answers `401 invalid_share_token`,
        without saying which. This is the request that counts as opening the
        link; the document, pictures and files read after it are not counted.
      operationId: getShared
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: The trip and what may be read of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shared"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/shared/document:
    get:
      tags: [Sharing]
      summary: Read the shared document
      description: |
        The trip's one document, its plan or its report as `kind` in
        `/api/v1/shared` says, in the same form the application reads it and for
        reading only. A trip without its document answers `404`.
      operationId: getSharedDocument
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/report/pdf:
    get:
      tags: [Sharing]
      summary: Download the shared report as a PDF
      description: |
        The same document the link opens, rendered as a file to keep or to print.
        A link made without private files renders without them, exactly as the
        screen shows it.
      operationId: getSharedReportPDF
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ReportPDFPhotos"
        - $ref: "#/components/parameters/ReportPDFLanguage"
        - $ref: "#/components/parameters/ReportPDFContentLanguage"
        - $ref: "#/components/parameters/ReportPDFUnits"
      responses:
        "200":
          $ref: "#/components/responses/ReportPDF"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripID}/media:
    get:
      tags: [Media]
      summary: List the trip's files
      description: Every file of the trip, newest first. Viewers see private files too.
      operationId: listMedia
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          description: The trip's files.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Media]
      summary: Upload files
      description: |
        A multipart upload with one or more `file` parts; a `private` part set to
        `true` before them marks everything that follows as private. What a file
        is is decided from its own bytes, never from the declared type: only
        JPEG, PNG and WebP are stored. A file above the configured size answers
        `413`, and a trip that has used up its allowance answers `409` with
        `media_quota`.

        A trip holds a picture once. A `source_checksum` part before a file
        names the SHA-256, in hex, of the original the browser shrank it from;
        it applies to that one file. A file whose own sum or source sum matches
        either sum of a file of the trip answers `409` with `duplicate_media`.
      operationId: uploadMedia
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                private:
                  type: boolean
                source_checksum:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                  description: SHA-256 of the original the next file was shrunk from.
      responses:
        "201":
          description: The stored files.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"

  /api/v1/media/{mediaID}:
    get:
      tags: [Media]
      summary: Read a file
      description: |
        The stored bytes, with the type they were stored as. The answer carries
        an `ETag` of the file's checksum and may be cached for a year: the bytes
        under an identifier never change.
      operationId: getMediaFile
      parameters:
        - $ref: "#/components/parameters/MediaID"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Media]
      summary: Change a file
      description: Only whether the file is private can be changed; the bytes cannot.
      operationId: updateMedia
      parameters:
        - $ref: "#/components/parameters/MediaID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_private:
                  type: boolean
      responses:
        "200":
          description: The file as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Media]
      summary: Delete a file
      description: |
        Removes the file from the trip, from every gallery it hung in and from
        the disk. There is no undo: the trash belongs to a later stage.
      operationId: deleteMedia
      parameters:
        - $ref: "#/components/parameters/MediaID"
      responses:
        "204":
          description: The file is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/media/{mediaID}/thumbnail:
    get:
      tags: [Media]
      summary: Read a preview
      description: |
        A JPEG preview no wider than the requested size, rendered on demand and
        turned the way the picture's own metadata says it should be. Only the
        offered widths are accepted.
      operationId: getMediaThumbnail
      parameters:
        - $ref: "#/components/parameters/MediaID"
        - $ref: "#/components/parameters/PreviewSize"
      responses:
        "200":
          description: The preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/media-links:
    put:
      tags: [Media]
      summary: Set a gallery
      description: |
        Makes a trip, a day or a place show exactly these files, in this order.
        The call replaces whatever was shown before, so repeating it changes
        nothing, and every file must belong to the same trip as the target.
      operationId: setMediaLinks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMediaLinksRequest"
      responses:
        "204":
          description: The gallery is as described.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/media-favorites:
    post:
      tags: [Media]
      summary: Mark the report's favourites
      description: |
        Marks files as the pictures the report shows, or stops marking them. The
        gallery of a trip names files rather than the places they hang in, so the
        mark lands on every day and place of the report a file is linked to; a
        day or a place that would end up showing more than seven is refused and
        nothing is changed. The days and places of a plan have no favourites.
      operationId: setMediaFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMediaFavoritesRequest"
      responses:
        "204":
          description: The files are marked as described.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/shared/media/{mediaID}:
    get:
      tags: [Sharing]
      summary: Read a shared file
      description: |
        A file of the trip the link opens. A file of another trip, and a private
        file in a link that was not given private files, answer `404`.
      operationId: getSharedMediaFile
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/MediaID"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/tracks/{trackID}/file:
    get:
      tags: [Sharing]
      summary: Download a shared track file
      description: |
        The file a track of the shared trip was imported from. A track of
        another trip answers `404`.
      operationId: getSharedTrackFile
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/TrackID"
      responses:
        "200":
          $ref: "#/components/responses/TrackFile"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/media/{mediaID}/thumbnail:
    get:
      tags: [Sharing]
      summary: Read a shared preview
      description: The preview of a file the link opens, under the same rules as the file itself.
      operationId: getSharedMediaThumbnail
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/MediaID"
        - $ref: "#/components/parameters/PreviewSize"
      responses:
        "200":
          description: The preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/trips/{tripID}/budget:
    get:
      tags: [Budget]
      summary: Read the trip's budget
      description: |
        The totals, the breakdown by category and by day, and every individual
        cost of the trip's document. A plan counts what it commits to; a report
        counts the planned amounts it carries and what was really spent beside
        them, read from the report alone.
      operationId: getBudget
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          $ref: "#/components/responses/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripID}/reports:
    post:
      tags: [Trips]
      summary: Write a report from a plan
      description: |
        Creates a new report trip owned by the reader, who needs only to be able
        to read the plan. The plan's title, summary, dates, time zone, currency,
        travellers and budget are copied, and so is its content: the days, the
        places put in them, the stays, the legs with their calculations, the
        separate expenses and every planned amount, each copy remembering the row
        it came from. The plan's unassigned places, members, links and pictures
        are not copied.

        From then on the two are independent trips: editing or deleting the plan
        never moves a figure of the report. A trip that is itself a report
        answers `409 not_a_plan`.
      operationId: createReportFromPlan
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "201":
          description: The new report trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/trips/{tripID}/report/pdf:
    get:
      tags: [Documents]
      summary: Download the report as a PDF
      description: |
        The report rendered as a file: a cover, the figures it opens with, every
        day with its places, journeys, stays and photographs, and the comparison
        of what was planned against what was spent. Its language and its
        distance units are the reader's own, from their profile.

        The document is rendered by the server, so it reads the same wherever it
        was asked for. Photographs are included at the width the page draws them
        and are capped at 200; `photos=false` leaves them out, which is the
        difference between a file of a few megabytes and one of a few dozen.
      operationId: getReportPDF
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/ReportPDFPhotos"
        - $ref: "#/components/parameters/ReportPDFContentLanguage"
      responses:
        "200":
          $ref: "#/components/responses/ReportPDF"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{documentID}:
    get:
      tags: [Documents]
      summary: Read a document
      description: |
        The whole document: days with their elements in schedule order, the
        unassigned places, stays, nights and totals.
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Documents]
      summary: Change a document's opening and closing words
      description: |
        The text before and after the days of a report. Omitted fields keep
        their value.
      operationId: updateDocument
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                intro_md:
                  type: string
                  maxLength: 20000
                summary_md:
                  type: string
                  maxLength: 20000
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/documents/{documentID}/translations/{lang}:
    put:
      tags: [Documents]
      summary: Translate a report's words
      description: |
        Writes fields of a report in one of the languages it is translated
        into: the trip's title and summary, the words before and after the
        days, a day's title and notes, a stay's name and notes, a place's name,
        description and story, and a leg's note. Times, ratings, amounts and
        pictures are the same in every language and are not translated.

        An empty value removes the translation, and the field is read in the
        original again. Whoever may edit the report may translate it. The answer
        is the whole document; a translation of the trip's own title or summary
        is read back with the trip.
      operationId: saveTranslations
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - name: lang
          in: path
          required: true
          description: A language the report is translated into; not its original.
          schema:
            type: string
            enum: [en, ru]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translations]
              additionalProperties: false
              properties:
                translations:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [target_type, target_id, field, value]
                    additionalProperties: false
                    properties:
                      target_type:
                        type: string
                        enum: [trip, document, day, stay, transfer, item, leg]
                      target_id:
                        type: string
                        format: uuid
                        description: The element translated; the trip's own identifier for `trip`.
                      field:
                        type: string
                        enum: [title, summary, intro_md, summary_md, notes_md, name, description_md, story_md, note,
                               from_name, to_name]
                        description: One of the fields the target translates.
                      value:
                        type: string
                        description: The translated text; empty removes the translation.
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/documents/{documentID}/days:
    post:
      tags: [Documents]
      summary: Add a day
      description: |
        On a trip with dates every day has a date, so a new day lengthens the
        trip by one: its end date moves and the other document gains an empty day.
      operationId: createDay
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDayRequest"
      responses:
        "201":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/documents/{documentID}/days:reorder:
    post:
      tags: [Documents]
      summary: Reorder the days
      description: |
        Dates stay in calendar order, so the content moves between dates.
      operationId: reorderDays
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderDaysRequest"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/documents/{documentID}/items:
    post:
