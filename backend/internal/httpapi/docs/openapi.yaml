        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/items/{itemID}/night:
    patch:
      tags: [Documents]
      summary: Tell the story of a night of a report
      description: |
        The story of the night a day of a report ends with, kept on the day's
        evening stay mark (`kind` `stay_anchor`, `anchor` `evening`) and read
        back as its `story_md`. The mark keeps the story while the day has a
        stay, whichever stay it is; a day left without one loses its mark and
        the story with it. Any other element answers `422` with reason
        `not_a_night`, a plan's mark `422` with reason `report_only`. Its
        translations are written like a place's, as `story_md` of target
        `item`. Owners and editors may.
      operationId: updateNight
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [story_md]
              properties:
                story_md:
                  type: string
                  maxLength: 20000
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/items/{itemID}/track:
    post:
      tags: [Documents]
      summary: Import the line of an activity
      description: |
        A multipart upload with one `file` part holding a GPX or KML export of
        a hike, a walk or a descent that makes up an activity: in a report the
        recording of what was travelled, in a plan the route meant to be taken.
        A place answers `422` with reason `activity_only`; turning an activity
        into a place removes its line. It replaces whatever the place had. The length, the height
        gained and lost and a thinned line are read from the file, and the file
        itself is kept to be downloaded from `/tracks/{trackID}/file`. The
        length is added to the legs of the day, as distance covered inside the
        activity rather than between places. A day has no recording of its own.
        An activity with no position takes the line's first point. In a report,
        when the file records time, an activity with no `actual_time` or
        `actual_end_time` takes the recording's first and last moment in the
        trip's time zone. A position or a time already set is kept. A report
        copied from a plan starts with the plan's routes, files included.
        The source file counts against the trip allowance (`409`,
        `media_quota`) and the instance allowance (`507`, `storage_quota`).
      operationId: importItemTrack
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "507":
          $ref: "#/components/responses/StorageQuota"
    patch:
      tags: [Documents]
      summary: Set the speed an activity's line is timed at
      description: |
        The speed on the flat, in km/h, the time to walk the line is worked out
        at, overriding the plan's own `track_speed_kmh`; null takes the plan's
        speed again. The time itself is worked out by the reader from the
        line's `grades`. Owners and editors may.
      operationId: updateItemTrack
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [speed_kmh]
              properties:
                speed_kmh:
                  type: [number, "null"]
                  minimum: 1
                  maximum: 12
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Documents]
      summary: Remove the recorded line of a place or an activity
      operationId: deleteItemTrack
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

