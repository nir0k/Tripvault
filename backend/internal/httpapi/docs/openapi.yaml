  /api/v1/days/{dayID}:
    patch:
      tags: [Documents]
      summary: Change a day
      operationId: updateDay
      parameters:
        - $ref: "#/components/parameters/DayID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayRequest"
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Documents]
      summary: Delete a day
      description: |
        A plan day's places go to the unassigned list. On a trip with dates the
        trip becomes a day shorter; when the other document would lose a day with
        content the answer is `409 days_would_be_removed` until `confirm=true`. A
        document keeps at least one day (`422`, reason `last_day`).
      operationId: deleteDay
      parameters:
        - $ref: "#/components/parameters/DayID"
        - name: confirm
          in: query
          description: Accept that the other document loses its last day although it holds content.
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DaysWouldBeRemoved"
        "422":
