          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Documents]
      summary: Change a document's opening and closing words
      description: |
        The text before and after the days of a report. Omitted fields keep
        their value.
      operationId: updateDocument
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                intro_md:
                  type: string
                  maxLength: 20000
                summary_md:
                  type: string
                  maxLength: 20000
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/documents/{documentID}/translations/{lang}/file:
    get:
      tags: [Documents]
      summary: Write a report's words into a translation file
      description: |
        A YAML file of every word of the report a reader sees, for one of the
        languages it is translated into: the trip's title and summary, the
        words before and after the days, each day with its places and the
        notes of its journeys, the stays and the transfers. Every text is a
        pair, `original` and `translation`, the translation holding what the
        report has so far; a text that does not exist is left out. The file
        says in `instructions` what to do with it, for a person or a model.
        Whoever may edit the report may.
      operationId: getTranslationFile
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - name: lang
          in: path
          required: true
          description: A language the report is translated into; not its original.
          schema:
            type: string
            enum: [en, ru]
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: "`attachment` named after the trip and the language, such as “Iceland.ru.yaml”."
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      tags: [Documents]
      summary: Read the translations back from a file
      description: |
        Reads a file written by the `GET` of this path, filled in, and saves
        every translation in it at once: each field is checked before anything
        is written. An empty `translation` removes one; the originals are not
        read. An entry naming an element the report no longer has is skipped
        and counted. A file of another language answers `422` with reason
        `wrong_language`, anything else than such a file `invalid_file`.
      operationId: putTranslationFile
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - name: lang
          in: path
          required: true
          schema:
            type: string
            enum: [en, ru]
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 8388608
      responses:
        "200":
          description: What the file brought.
          content:
            application/json:
              schema:
                type: object
                required: [saved, skipped]
                properties:
                  saved:
                    type: integer
                    description: The fields written, the emptied ones included.
                  skipped:
                    type: integer
                    description: Entries naming an element the report no longer has.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/documents/{documentID}/translations/{lang}:
    put:
      tags: [Documents]
      summary: Translate a report's words
      description: |
        Writes fields of a report in one of the languages it is translated
        into: the trip's title and summary, the words before and after the
        days, a day's title and notes, a stay's name and notes, a place's name,
        description and story, and a leg's note. Times, ratings, amounts and
        pictures are the same in every language and are not translated.

        An empty value removes the translation, and the field is read in the
        original again. Whoever may edit the report may translate it. The answer
        is the whole document; a translation of the trip's own title or summary
        is read back with the trip.
      operationId: saveTranslations
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - name: lang
          in: path
          required: true
          description: A language the report is translated into; not its original.
          schema:
            type: string
            enum: [en, ru]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translations]
              additionalProperties: false
              properties:
                translations:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [target_type, target_id, field, value]
                    additionalProperties: false
                    properties:
                      target_type:
                        type: string
                        enum: [trip, document, day, stay, transfer, item, leg, stop]
                      target_id:
                        type: string
                        format: uuid
                        description: The element translated; the trip's own identifier for `trip`.
                      field:
                        type: string
                        enum: [title, summary, intro_md, summary_md, notes_md, highlight, name, description_md,
                               story_md, note, from_name, to_name, note_md]
                        description: One of the fields the target translates.
                      value:
                        type: string
                        description: The translated text; empty removes the translation.
      responses:
        "200":
          $ref: "#/components/responses/DocumentChanged"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
