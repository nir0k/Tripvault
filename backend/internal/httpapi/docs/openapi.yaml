  /api/v1/items/{itemID}/attachments:
    post:
      tags: [Documents]
      summary: Attach a file to a place or an activity
      description: |
        A multipart upload with one `file` part: a ticket, a booking, a
        timetable. Only a plan's places carry files; a report's place answers
        `422` with reason `plan_only`. Only documents and pictures are accepted, decided from the
        bytes rather than the declared type, and the file's name has to end the
        way its kind is named: PDF (`.pdf`); plain text (`.txt`, `.md`,
        `.markdown`, `.csv`, a calendar `.ics`, a saved message `.eml`); a saved
        web page (`.html`, `.htm`); RTF; Word, Excel and PowerPoint documents
        (`.docx`, `.xlsx`, `.pptx` and the older `.doc`, `.xls`, `.ppt`);
        OpenDocument (`.odt`, `.ods`, `.odp`); and JPEG, PNG, WebP, AVIF and BMP
        pictures. Anything else - archives, programs, scripts, video, sound,
        GIF, HEIC, TIFF, RAW, SVG - answers `415` with `unsupported_attachment`,
        and so does a document that carries macros or a file packed inside it.
        A place carries at most ten files (`422`, reason `attachment_limit`) and
        the same file once (`409`, `duplicate_attachment`); a file counts
        against the trip's allowance (`409`, `media_quota`) and is bounded by
        `TRIPVAULT_MEDIA_ATTACHMENT_MAX_SIZE_MB` (`413`). A stay mark takes
        none. Attachments are listed on the place in the document, never
        through a read-only link, and are not copied when the place, its day or
        its plan is copied. A `description` field sent before the file is the
        line describing it, at most 150 characters once breaks and runs of
        spaces are folded into single spaces (`422`, reason `too_long`).
        Owners and editors may.
      operationId: createItemAttachment
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                description:
                  type: string
                  maxLength: 150
                  description: What the file is; sent before the file.
                file:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "507":
          $ref: "#/components/responses/StorageQuota"

  /api/v1/attachments/{attachmentID}:
    patch:
      tags: [Documents]
      summary: Change the line describing an attached file
      description: |
        At most 150 characters, folded into one line; an empty description
        takes the line away. The file itself is replaced by attaching another.
        Owners and editors may.
      operationId: updateAttachment
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      requestBody:
        required: true
