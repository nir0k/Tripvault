openapi: 3.1.0

info:
  title: Tripvault API
  # Replaced at start-up with the running build's version, which comes from the
  # repository's VERSION file. The placeholder keeps this a valid document.
  version: 0.0.0-dev
  summary: Self-hosted trip planning and trip reports
  description: |
    REST API of Tripvault. The web client uses exactly this API, and so can any
    other client.

    **Authentication.** Sign in with `POST /api/v1/auth/login` and send the
    access token in the `Authorization: Bearer` header. Access tokens are
    short-lived; exchange the refresh token for a new pair before the access
    token expires. A refresh token works once: the one you present is replaced.

    **Temporary passwords.** An account created or reset by an administrator
    must change its password first. Until it does, every endpoint except
    `GET /api/v1/me` and `POST /api/v1/me/password` answers
    `403 password_change_required`.

    **Amounts** are decimal strings with two fractional digits, such as
    `"1240.50"`, in the trip currency. **Dates** are `YYYY-MM-DD`.

    **Paging.** Paged lists accept `limit` and `cursor` and return
    `next_cursor`, which is `null` on the last page.

    **Errors.** Every error has the same shape: a stable `code` to branch on,
    an English `message`, and optional `details`. Clients translate the code.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  # Relative on purpose: the document is served by the API itself, so this
  # resolves to whichever host the reader reached it on.
  - url: /
    description: This instance

tags:
  - name: Service
    description: Liveness, readiness and client configuration.
  - name: Authentication
    description: Sign-in, token refresh and sign-out.
  - name: Profile
    description: The signed-in account's own settings, password and sessions.
  - name: Trips
    description: |
      Trips, their members and ownership. A person's role on a trip - owner,
      editor or viewer - is read on every request. A trip the reader has no
      access to answers `404`, exactly like a missing one; an action the role
      does not allow answers `403 forbidden`.
  - name: Tags
    description: |
      A person's own words to mark trips with. Tags belong to the person, not
      to a trip: every member of a trip tags it in their own way, a viewer
      included, and nobody sees another's tags. A trip lists the reader's tags
      on it in `tags`.
  - name: Themes
    description: |
      Colour themes the administrator uploads for everybody on the instance.
      A theme is a file of palettes: a light one, a dark one or both, each
      naming every colour of the interface. A person chooses a theme in
      `theme_id` of their profile and keeps choosing light, dark or auto in
      `theme`; a theme with one palette is shown in it whatever that says.
  - name: Documents
    description: |
      A trip's plan and report: days, places, stays and stay marks. Every
      change answers with the whole document, recomputed, because a change to
      one element moves stay marks, schedules and totals elsewhere. Owners and
      editors change documents; viewers read them.
  - name: Sharing
    description: |
      Read-only links to a trip, created and revoked by its owner. The token of
      a link is 32 random bytes in base64url and lives in the fragment of the
      external address, `https://<host>/s#token=<token>`, which the browser never
      sends to a server. In requests it travels in the `X-Share-Token` header
      rather than the query, so no proxy logs it. Only its SHA-256 is stored: the
      full token appears once, in the answer that created the link, and a lost
      link is replaced rather than recovered. Revoking takes effect at once.
  - name: Budget
    description: |
      What a trip plans to spend, next to what it is willing to spend. Nothing
      here is stored: the figures are assembled from the trip's plan on every
      request, so a cost typed on a place, a stay, a leg or a separate expense is
      in the totals at once. A report keeps its own record of what was actually
      spent and reports it with the report, not here.
  - name: Media
    description: |
      The files a trip carries: photographs of its report today. Bytes are
      served only from these endpoints, which check the reader against the trip
      on every request, and never from a static path. A file marked private is
      left out of a read-only link unless that link was created to show private
      files. Previews are rendered on demand at fixed widths and may be cached
      by the browser, because the bytes under an identifier never change.
  - name: Packing
    description: |
      A plan's list of what to take: things, gear, documents, in categories the
      trip names itself. The list is packed together, so one tick serves the
      whole group, and an item may name the member who brings it. Every change
      answers with the whole list. Owners and editors change it; viewers read
      it. A report has none.
  - name: Ideas
    description: |
      A person's ideas of where to go one day: where, when it is best, how long
      it takes and roughly what it costs. A person's ideas are one list, which
      its owner may share whole: a viewer reads it, an editor also adds,
      changes and deletes its ideas, and only the owner decides who is a
      member. Every change is kept in the list's history with who made it. An
      idea of a list not shared with the reader reads as missing. The ideas
      come whole, the reader's own and the shared ones, for the interface to
      filter; a plan is made from an idea through `POST /trips`.
  - name: Places
    description: Place search, reverse lookups and reading positions from map links.
  - name: Administration
    description: Accounts, trips and service state. Administrators only.
  - name: Backups
    description: |
      Copies of the whole service - every account, trip and photograph - and
      putting one back. Administrators only. An archive is a gzipped tar holding
      the tables as CSV beside the uploaded files, optionally locked with age, so
      it can be opened years later by the `age` command line and a text editor
      rather than only by this service. Credentials typed in here - an SFTP
      password or private key, the passphrase archives are locked with - are
      sealed with a key that lives outside the database and are never returned:
      a configuration lists only the names of the credentials it holds.

security:
  - bearer: []

paths:
  /healthz:
    get:
      tags: [Service]
      summary: Liveness probe
      description: Reports that the process is alive. Checks no dependency.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [Service]
      summary: Readiness probe
      description: Reports whether the service can serve traffic.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /version:
    get:
      tags: [Service]
      summary: Running version
      operationId: getVersion
      security: []
      responses:
        "200":
          description: The build information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"

  /api/v1/config:
    get:
      tags: [Service]
      summary: Client configuration
      description: Instance settings a client needs before anybody signs in.
      operationId: getClientConfig
      security: []
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfig"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: |
        Exchanges an email and password for a session. An unknown address, a
        deactivated account and a wrong password all answer
        `401 invalid_credentials`. Repeated attempts at one address from one
        client, many at it from clients it was not signed in to from, or many
        wrong passwords from one client answer `429 too_many_attempts` with
        `Retry-After`. While the server is checking as many passwords as it
        allows at once, a sign-in answers `503 busy` with `Retry-After`.
        The right password of a self-registered account whose address is not
        confirmed yet answers `403 email_not_verified` without a session; its
        `details.resend_available_in` is how many seconds remain before
        another confirmation message may be requested.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh a session
      description: |
        Exchanges a refresh token for a new token pair on the same session. A
        token can be exchanged once. Presenting one again after its session
        exchanged it ends that session, since somebody else holds a copy of it;
        within 30 seconds of the exchange it is only refused, as two tabs of one
        browser may refresh at the same moment. Either way it answers `401`.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out
      description: Ends the session the refresh token belongs to. Always answers 204.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Signed out.
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /api/v1/me:
    get:
      tags: [Profile]
      summary: The signed-in account
      operationId: getMe
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profile]
      summary: Change own settings
      description: Every field is optional; omitted fields are left as they are.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      tags: [Profile]
      summary: Delete own account
      description: |
        Deletes the signed-in account with everything only it holds: the trips it
        owns, with their documents, costs and photographs, its memberships of
        other people's trips and its sessions. The photographs it uploaded into
        somebody else's trip stay there; only the record of who added them is
        forgotten. There is no undo, so the request carries the account's
        password; a wrong one answers `422` on `current_password`, and too many
        wrong ones `429`. The last active administrator is refused, because the
        service must keep one.
      operationId: deleteMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMeRequest"
      responses:
        "204":
          description: The account is gone.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The account is the last active administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"

  /api/v1/me/avatar:
    put:
      tags: [Profile]
      summary: Set own picture
      description: |
        Stores the picture the account is shown by, sent as a multipart upload
        with one `file` part. What is stored is not what was sent: the picture is
        rendered to one small square, so nothing keeps the camera's metadata. The
        kind of file is decided from its own bytes, and only the kinds this
        service accepts are stored.
      operationId: setAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The account, now wearing the picture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The file is larger than this service accepts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The bytes are not a kind of picture this service accepts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "507":
          $ref: "#/components/responses/StorageQuota"
    delete:
      tags: [Profile]
      summary: Remove own picture
      description: Leaves the account with the placeholder everybody starts with.
      operationId: deleteAvatar
      responses:
        "200":
          description: The account, without a picture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/home:
    get:
      tags: [Profile]
      summary: Read own home
      description: |
        Where the signed-in person lives, and the circle around it that is kept
        out of what their trips show to a reader from outside them: every
        read-only link - the document, its PDFs, the track files and the
        original pictures it downloads - and every PDF, whoever asks for it.
        The home is read back only by its owner, never with the account an
        administrator lists. Both fields are null when no home is set.
      operationId: getHome
      responses:
        "200":
          $ref: "#/components/responses/Home"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Profile]
      summary: Set own home
      description: |
        Stores the home and draws the circle hidden around it. The circle is not
        centred on the home but on a random point within half its radius, so the
        ends of the lines trimmed at its edge do not point at the door; it is
        drawn again only when the point or the radius changes. Inside the circle
        a place, a stay, an end of a transfer or a change of a journey keeps its
        name and loses its position and address, lines lose their points, a stop
        moves to the nearest point of its line still shown, a picture loses
        where it was taken - in the answer and, for a JPEG, in the original
        file - and a track file is sent as GPX without those points. Distances,
        times and costs are not changed.
      operationId: setHome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeInput"
      responses:
        "200":
          $ref: "#/components/responses/Home"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Profile]
      summary: Forget own home
      description: Removes the home; the person's trips are shown whole again.
      operationId: deleteHome
      responses:
        "204":
          description: The home is forgotten.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/{userID}/avatar:
    get:
      tags: [Profile]
      summary: Read an account's picture
      description: |
        The picture an account is shown by, as a JPEG. Readable by anybody signed
        in: the people of a trip see each other's names, and the picture says no
        more than the name does. An account without one answers `404`, which is
        what the interface draws its placeholder on.
      operationId: getAvatar
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: The picture.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The copy the client holds is current.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/password:
    post:
      tags: [Profile]
      summary: Change own password
      description: |
        Requires the current password. Ends every other session of the account;
        the session making the change stays signed in. Clears the temporary
        password flag. Ten wrong current passwords in fifteen minutes - counted
        together with those typed to delete the account - answer `429` until the
        window ends.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "503":
          $ref: "#/components/responses/Busy"

  /api/v1/me/sessions:
    get:
      tags: [Profile]
      summary: Own live sessions
      operationId: listSessions
      responses:
        "200":
          description: The sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/sessions/{sessionID}:
    delete:
      tags: [Profile]
      summary: End one of own sessions
      description: Its access token stops working on the next request.
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/search:
    get:
      tags: [Trips]
      summary: Find people to add to a trip
      description: |
        Matches active accounts by a part of their name or by their whole email
        address, leaving out the reader; a part of an address matches nobody. A
        query shorter than three characters returns nothing. At most ten
        results. An address is returned whole only when the query is that
        address; otherwise it is masked to its first two characters and its
        domain, as in `an***@example.com`.
      operationId: searchUsers
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TripUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/geo/search:
    get:
      tags: [Places]
      summary: Find places by name or address
      description: |
        Results near `lat`/`lng` come first. A query shorter than two
        characters returns nothing. Answers are cached for everybody by text,
        language and an area of about ten kilometres; clients should wait at
        least 300 ms after typing stops. Without a configured geocoder the
        answer is `503 geocoding_disabled`; when it is busy or down,
        `503 geocoding_limited` or `503 geocoding_unavailable`.
      operationId: geoSearch
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          $ref: "#/components/responses/Places"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/geo/reverse:
    get:
      tags: [Places]
      summary: Name the places at a position
      description: Nearest first, at most three. Errors as for the search.
      operationId: geoReverse
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          $ref: "#/components/responses/Places"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/geo/parse-link:
    get:
      tags: [Places]
      summary: Read a position from coordinates or a map link
      description: |
        Understands `lat, lng` pairs, `geo:` URIs, Google Maps links (place,
        map centre, `q`/`ll`/`query` parameters, and `maps.app.goo.gl` short
        links, which are followed only through Google hosts) and
        openstreetmap.org links (`mlat`/`mlon` or `#map=zoom/lat/lng`). Needs no
        geocoder, except for a Google place link that names its place without a
        position, as the Google Maps app often shares: that name is searched
        with the configured geocoder and the first result's position is
        returned, named by the link's name up to its first comma. A geocoder
        that is busy or does not answer gives `503` as `/geo/search` does.
        Anything else, a name-only link without a geocoder or with no result
        included, answers `422` with reason `unrecognized_link`.
      operationId: geoParseLink
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            maxLength: 2000
      responses:
        "200":
          description: The position, with the place name when the link carries one.
          content:
            application/json:
              schema:
                type: object
                required: [lat, lng, name]
                properties:
                  lat:
                    type: number
                  lng:
                    type: number
                  name:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/trips:
    get:
      tags: [Trips]
      summary: List own and shared trips
      description: |
        By relevance, the default, ongoing trips and overdue plans come first,
        then upcoming ones by start date, then trips without dates, newest
        first, then finished trips from the most recent: plans completed or
        cancelled, and reports whose dates have passed. By update, the trip whose content anybody
        changed last comes first. A plan and a report are separate trips;
        `kind` lists one or the other.
      operationId: listTrips
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [all, owned, shared]
            default: all
        - name: kind
          in: query
          description: Keep only plans or only reports; omitted keeps both.
          schema:
            type: string
            enum: [plan, report]
        - name: year
          in: query
          description: Keep only trips whose period touches this year.
          schema:
            type: integer
        - name: q
          in: query
          description: Part of the title.
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          description: |
            The order of the list. A cursor continues only the order it was
            returned for.
          schema:
            type: string
            enum: [relevance, updated]
            default: relevance
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of trips.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trip"
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [Trips]
      summary: Create a trip
      description: |
        The reader becomes the owner. `kind` says whether the trip is a plan or a
        report written from scratch; either comes with one empty day per date.
        The currency defaults to the reader's default currency. A report made
        from a plan is created with `POST /api/v1/trips/{tripID}/reports`.
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/trips/years:
    get:
      tags: [Trips]
      summary: Years of own and shared trips
      description: The calendar years the reader's plans or reports touch, newest first, for the year filter.
      operationId: listTripYears
      parameters:
        - name: kind
          in: query
          description: Count only plans or only reports; omitted counts both.
          schema:
            type: string
            enum: [plan, report]
      responses:
        "200":
          description: The years.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/trips/{tripID}:
    get:
      tags: [Trips]
      summary: Read a trip
      operationId: getTrip
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Trips]
      summary: Change a trip
      description: |
        Owners and editors. Omitted fields are left as they are; `null` clears
        the dates and the budget. Dates are set and cleared together. `state`
        closes a plan as completed or cancelled, and `null` opens it again.

        New dates reshape the documents: moving the start moves every day and
        stay by the same number of days, and a period of another length adds
        empty days at the end or removes days from the end. When that removes
        days holding content the answer is `409 days_would_be_removed` until
        the request carries `"confirm": true`; a removed plan day hands its
        places to the unassigned list.
      operationId: updateTrip
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequest"
      responses:
        "200":
          description: The updated trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DaysWouldBeRemoved"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Trips]
      summary: Delete a trip
      description: Owner only. The trip disappears at once and is purged after 30 days.
      operationId: deleteTrip
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List one's tags
      description: The reader's own tags by name, each with the number of trips wearing it.
      operationId: listTags
      responses:
        "200":
          description: The tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tags]
      summary: Create a tag
      description: A name the reader already uses, in any case, answers `409 already_exists`.
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tags/{tagID}:
    patch:
      tags: [Tags]
      summary: Rename a tag or change its colour
      description: |
        Every trip wearing the tag shows the change. A name another of the
        reader's tags has answers `409 already_exists`.
      operationId: updateTag
      parameters:
        - $ref: "#/components/parameters/TagID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Tags]
      summary: Delete a tag
      description: The tag leaves the reader's list and every trip it was put on.
      operationId: deleteTag
      parameters:
        - $ref: "#/components/parameters/TagID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/themes:
    get:
      tags: [Themes]
      summary: List the instance's themes
      description: Every theme of the instance by name, with its palettes, to choose one from.
      operationId: listThemes
      responses:
        "200":
          description: The themes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstanceTheme"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ideas:
    get:
      tags: [Ideas]
      summary: List the ideas one may open
      description: |
        Every idea of the reader's own list and of the lists shared with them,
        the last changed first. Each carries the reader's role on its list and
        only the reader's own tags.
      operationId: listIdeas
      responses:
        "200":
          description: The ideas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Idea"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Ideas]
      summary: Add an idea
      description: |
        The idea goes into the reader's own list, or into the list of `owner_id`
        when the reader edits it; a viewer of that list answers `403`, and a list
        not shared with the reader `404`. Without a currency the idea takes the
        reader's default one.
      operationId: createIdea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/ideas/lists:
    get:
      tags: [Ideas]
      summary: List the lists of ideas one may open
      description: The reader's own list first, then the lists shared with them by their owners' names.
      operationId: listIdeaLists
      responses:
        "200":
          description: The lists.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IdeaList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ideas/lists/{ownerID}:
    delete:
      tags: [Ideas]
      summary: Leave a list of ideas
      description: Takes the reader off a list shared with them, with their tags on its ideas.
      operationId: leaveIdeaList
      parameters:
        - name: ownerID
          in: path
          required: true
          description: The owner of the list.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Left.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ideas/members:
    get:
      tags: [Ideas]
      summary: List the people one's ideas are shared with
      description: The members of the reader's own list, by name.
      operationId: listIdeaMembers
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IdeaMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Ideas]
      summary: Share one's ideas with a person
      description: |
        A viewer reads every idea of the reader's list; an editor also adds,
        changes and deletes them. Somebody who has the list already answers
        `409 already_member`; an unknown or deactivated account answers `422`
        with reason `unknown_user` or `inactive_user`.
      operationId: addIdeaMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTripMemberRequest"
      responses:
        "201":
          description: Shared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaMember"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/ideas/members/{userID}:
    patch:
      tags: [Ideas]
      summary: Change a member's role on one's ideas
      operationId: updateIdeaMember
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripMemberRequest"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaMember"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Ideas]
      summary: Stop sharing one's ideas with a person
      operationId: removeIdeaMember
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ideas/invitations:
    get:
      tags: [Ideas]
      summary: List the invitations to one's ideas
      operationId: listIdeaInvitations
      responses:
        "200":
          description: The reader's invitations without their tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TripInvitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Ideas]
      summary: Invite a person to one's ideas by email
      description: Needs mail delivery; without it answers `409 mail_disabled`.
      operationId: createIdeaInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, locale]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [editor, viewer] }
                locale: { type: string, enum: [en, ru, ""] }
      responses:
        "201":
          description: Invitation queued for delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripInvitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/ideas/invitations/{invitationID}:
    delete:
      tags: [Ideas]
      summary: Revoke an invitation to one's ideas
      operationId: revokeIdeaInvitation
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204": { description: Invitation revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ideas/history:
    get:
      tags: [Ideas]
      summary: Read the history of a list of ideas
      description: |
        Who added, changed and deleted the ideas of a list, and when, the
        newest first and at most 200 entries: of one idea with `idea_id`,
        otherwise of the list of `owner_id`, the reader's own when it is left
        out. Every member of the list reads it. Tags are the reader's own and
        are not part of it.
      operationId: getIdeaHistory
      parameters:
        - name: idea_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: owner_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IdeaChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/ideas/{ideaID}:
    get:
      tags: [Ideas]
      summary: Read an idea
      operationId: getIdea
      parameters:
        - $ref: "#/components/parameters/IdeaID"
      responses:
        "200":
          description: The idea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Ideas]
      summary: Save an idea
      description: |
        The owner and the editors of the idea's list only; a viewer answers
        `403`. Every field is sent, as the form edits them all at once; the
        tags are set apart.
      operationId: updateIdea
      parameters:
        - $ref: "#/components/parameters/IdeaID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Ideas]
      summary: Delete an idea
      description: The owner and the editors of the idea's list, whoever wrote it; a viewer answers `403`.
      operationId: deleteIdea
      parameters:
        - $ref: "#/components/parameters/IdeaID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ideas/{ideaID}/tags:
    put:
      tags: [Ideas]
      summary: Tag an idea
      description: |
        Replaces the reader's tags on one of their ideas. Every identifier must
        name one of the reader's tags, or the answer is `422` with reason
        `unknown_tag`; repeats are dropped.
      operationId: setIdeaTags
      parameters:
        - $ref: "#/components/parameters/IdeaID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_ids]
              additionalProperties: false
              properties:
                tag_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: The idea with its new tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/ideas/{ideaID}/photos:
    post:
      tags: [Ideas]
      summary: Add a photo to an idea
      description: |
        A multipart upload with one `file` part holding a picture. The server
        renders it into a photo up to 2048 px wide and a preview up to 480 px,
        both JPEG without the camera's metadata, and adds it at the end of the
        idea's photos. An idea keeps at most 10; one more answers `422` with
        reason `too_many`.
      operationId: addIdeaPhoto
      parameters:
        - $ref: "#/components/parameters/IdeaID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The idea with the new photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "507":
          $ref: "#/components/responses/StorageQuota"

  /api/v1/ideas/{ideaID}/photos/{photoID}:
    get:
      tags: [Ideas]
      summary: Read a photo of an idea
      description: The photo as JPEG, or its preview with `size=preview`; only to the idea's owner.
      operationId: getIdeaPhoto
      parameters:
        - $ref: "#/components/parameters/IdeaID"
        - name: photoID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          schema:
            type: string
            enum: [preview]
      responses:
        "200":
          description: The picture.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The copy the browser holds is current.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Ideas]
      summary: Remove a photo of an idea
      operationId: deleteIdeaPhoto
      parameters:
        - $ref: "#/components/parameters/IdeaID"
        - name: photoID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The idea without the photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripID}/tags:
    put:
      tags: [Tags]
      summary: Tag a trip
      description: |
        Replaces the reader's tags on a trip; other members' tags stay as they
        are. Anybody who can open the trip may, a viewer included. Every
        identifier must name one of the reader's tags, or the answer is `422`
        with reason `unknown_tag`; repeats are dropped, and a trip wears at
        most 100 of the reader's tags.
      operationId: setTripTags
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_ids]
              additionalProperties: false
              properties:
                tag_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: The trip with its new tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/trips/{tripID}/members:
    get:
      tags: [Trips]
      summary: List the people on a trip
      description: The owner first, then editors and viewers by name.
      operationId: listTripMembers
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TripMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Trips]
      summary: Add a person to a trip
      description: |
        Owner only. A person who already has access answers
        `409 already_member`; an unknown or deactivated account answers
        `422` with reason `unknown_user` or `inactive_user`.
      operationId: addTripMember
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTripMemberRequest"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripMember"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/trips/{tripID}/members/{userID}:
    patch:
      tags: [Trips]
      summary: Change a member's role
      description: Owner only. The owner is not a member and keeps the trip they created.
      operationId: updateTripMember
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripMemberRequest"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripMember"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Trips]
      summary: Remove a member
      description: Owner only.
      operationId: removeTripMember
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripID}/share-links:
    get:
      tags: [Sharing]
      summary: List the trip's links
      description: |
        Owner only. Revoked links are left out, and no link shows its token:
        that is returned once, when the link is created.
      operationId: listShareLinks
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          description: The trip's live links, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShareLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Sharing]
      summary: Create a link
      description: |
        Owner only. The answer is the only place the token and the full address
        ever appear; neither can be read again.
      operationId: createShareLink
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkRequest"
      responses:
        "201":
          description: The link, with its token shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedShareLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/share-links/{linkID}:
    delete:
      tags: [Sharing]
      summary: Revoke a link
      description: |
        Owner only. The link stops opening the trip at once, for everybody who
        has it. A link of a trip the reader does not own answers `404`.
      operationId: revokeShareLink
      parameters:
        - $ref: "#/components/parameters/LinkID"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared:
    get:
      tags: [Sharing]
      summary: Read what a link opens
      description: |
        Authenticated by `X-Share-Token` alone, with no account. A missing,
        unknown, revoked or expired token answers `401 invalid_share_token`,
        without saying which. This is the request that counts as opening the
        link; the document, pictures and files read after it are not counted.
      operationId: getShared
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: The trip and what may be read of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shared"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/shared/document:
    get:
      tags: [Sharing]
      summary: Read the shared document
      description: |
        The trip's one document, its plan or its report as `kind` in
        `/api/v1/shared` says, in the same form the application reads it and for
        reading only, less what is the travellers' own: the files attached to
        places, the booking references of stays, transfers and places, the
        contacts of stays, and who pays and shares a place's cost. The PDFs a
        link reads leave out the same. Nothing inside the home of anybody on
        the trip is shown either (`/me/home`). A trip without its document
        answers `404`.
      operationId: getSharedDocument
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/plan/pdf:
    get:
      tags: [Sharing]
      summary: Download the shared plan as a PDF
      description: |
        The plan the link opens, as a document to take on the way. The
        language and the units come from the query, as a link has no account
        to read them from.
      operationId: getSharedPlanPDF
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ReportPDFLanguage"
        - $ref: "#/components/parameters/ReportPDFUnits"
      responses:
        "200":
          $ref: "#/components/responses/ReportPDF"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/packing:
    get:
      tags: [Sharing]
      summary: Read the shared plan's packing list
      description: |
        The list of the plan the link opens. A link tells nothing about the
        people of a trip, so `bringer_id` is always null.
      operationId: getSharedPackingList
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          $ref: "#/components/responses/PackingListChanged"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/packing/pdf:
    get:
      tags: [Sharing]
      summary: Download the shared plan's packing list as a PDF
      description: The checklist without who brings what, in the language the query names.
      operationId: getSharedPackingPDF
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ReportPDFLanguage"
        - $ref: "#/components/parameters/PackingPDFCompact"
      responses:
        "200":
          $ref: "#/components/responses/ReportPDF"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/report/pdf:
    get:
      tags: [Sharing]
      summary: Download the shared report as a PDF
      description: |
        The same document the link opens, rendered as a file to keep or to print.
        A link made without private files renders without them, exactly as the
        screen shows it.
      operationId: getSharedReportPDF
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ReportPDFPhotos"
        - $ref: "#/components/parameters/ReportPDFLanguage"
        - $ref: "#/components/parameters/ReportPDFContentLanguage"
        - $ref: "#/components/parameters/ReportPDFUnits"
      responses:
        "200":
          $ref: "#/components/responses/ReportPDF"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripID}/media:
    get:
      tags: [Media]
      summary: List the trip's files
      description: Every file of the trip, newest first. Viewers see private files too.
      operationId: listMedia
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          description: The trip's files.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Media]
      summary: Upload files
      description: |
        A multipart upload with one or more `file` parts; a `private` part set to
        `true` before them marks everything that follows as private. What a file
        is is decided from its own bytes, never from the declared type: only
        JPEG, PNG and WebP are stored. A file above the configured size answers
        `413`, and a trip that has used up its allowance answers `409` with
        `media_quota`. An instance that has used its operator allowance answers
        `507` with `storage_quota`. One request carries at most 50 files - a 51st answers
        `413` with `too_many_files` - and its whole body at most what 50 files
        of the configured size add up to.

        A trip holds a picture once. A `source_checksum` part before a file
        names the SHA-256, in hex, of the original the browser shrank it from;
        it applies to that one file. A file whose own sum or source sum matches
        either sum of a file of the trip answers `409` with `duplicate_media`.
      operationId: uploadMedia
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                private:
                  type: boolean
                source_checksum:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                  description: SHA-256 of the original the next file was shrunk from.
      responses:
        "201":
          description: The stored files.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/StorageQuota"

  /api/v1/media/{mediaID}:
    get:
      tags: [Media]
      summary: Read a file
      description: |
        The stored bytes, with the type they were stored as. The answer carries
        an `ETag` of the file's checksum and may be cached for a year: the bytes
        under an identifier never change.
      operationId: getMediaFile
      parameters:
        - $ref: "#/components/parameters/MediaID"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Media]
      summary: Change a file
      description: Only whether the file is private can be changed; the bytes cannot.
      operationId: updateMedia
      parameters:
        - $ref: "#/components/parameters/MediaID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_private:
                  type: boolean
      responses:
        "200":
          description: The file as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Media]
      summary: Delete a file
      description: |
        Removes the file from the trip, from every gallery it hung in and from
        the disk. There is no undo: the trash belongs to a later stage.
      operationId: deleteMedia
      parameters:
        - $ref: "#/components/parameters/MediaID"
      responses:
        "204":
          description: The file is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/media/{mediaID}/thumbnail:
    get:
      tags: [Media]
      summary: Read a preview
      description: |
        A JPEG preview no wider than the requested size, rendered on demand and
        turned the way the picture's own metadata says it should be. Only the
        offered widths are accepted.
      operationId: getMediaThumbnail
      parameters:
        - $ref: "#/components/parameters/MediaID"
        - $ref: "#/components/parameters/PreviewSize"
      responses:
        "200":
          description: The preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/media-links:
    put:
      tags: [Media]
      summary: Set a gallery
      description: |
        Makes a trip, a day or a place show exactly these files, in this order.
        The call replaces whatever was shown before, so repeating it changes
        nothing, and every file must belong to the same trip as the target.
        Of the stay marks only the night a day of a report ends with - its
        evening mark - takes pictures, like a place and without a cover; any
        other mark answers `422` with reason `not_a_night`.
      operationId: setMediaLinks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMediaLinksRequest"
      responses:
        "204":
          description: The gallery is as described.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/media-favorites:
    post:
      tags: [Media]
      summary: Mark the report's favourites
      description: |
        Marks files as the pictures the report shows, or stops marking them. The
        gallery of a trip names files rather than the places they hang in, so the
        mark lands on every day and place of the report a file is linked to; a
        day or a place that would end up showing more than seven is refused and
        nothing is changed. The days and places of a plan have no favourites.
      operationId: setMediaFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMediaFavoritesRequest"
      responses:
        "204":
          description: The files are marked as described.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/shared/media/{mediaID}:
    get:
      tags: [Sharing]
      summary: Read a shared file
      description: |
        A file of the trip the link opens. A JPEG taken inside the home of
        anybody on the trip (`/me/home`) is sent without where it was taken. A
        file of another trip, and a private file in a link that was not given
        private files, answer `404`.
      operationId: getSharedMediaFile
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/MediaID"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/media:download:
    post:
      tags: [Sharing]
      summary: Download shared pictures
      description: |
        As `POST /trips/{tripID}/media:download`, for a link that allows
        downloads; otherwise `403 download_not_allowed`. A private picture in
        a link that was not given private files answers `404`.
      operationId: downloadSharedMedia
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaDownloadRequest"
      responses:
        "201":
          $ref: "#/components/responses/MediaDownload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/trips/{tripID}/media:download:
    post:
      tags: [Media]
      summary: Download pictures
      description: |
        Issues a download of the chosen pictures of a trip for the browser to
        open itself, with its own downloader - written to the disk as it
        comes, never held whole by a page. The answer names the address; the
        ticket behind it is set as an `HttpOnly` cookie scoped to that address,
        so no secret is ever in an address a proxy might log. The address
        serves for 10 minutes, as often as it is opened; a download started
        within them runs to its end. Every member may; a picture of another
        trip answers `404`.
      operationId: downloadMedia
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaDownloadRequest"
      responses:
        "201":
          $ref: "#/components/responses/MediaDownload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/downloads/{downloadID}:
    get:
      tags: [Media]
      summary: Open a download
      description: |
        What a download issued by `media:download` serves, read with the
        cookie it was issued with; no account is needed. One picture is its
        own file under its original name, and answers a `Range`, so the
        browser resumes it. Several are a ZIP archive named after the trip,
        the files stored rather than compressed and written as they are read;
        a name that repeats is numbered, "IMG_0001 (2).jpg". Without the
        cookie, or once it has expired, the address answers `404`.
      operationId: openDownload
      security: []
      parameters:
        - name: downloadID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The picture, or the archive.
          headers:
            Content-Disposition:
              description: "`attachment` with the picture's name, or the trip's for an archive."
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "206":
          description: A range of one picture.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/tracks/{trackID}/file:
    get:
      tags: [Sharing]
      summary: Download a shared track file
      description: |
        The file a track of the shared trip was imported from. A file that passes
        through the home of anybody on the trip (`/me/home`) is written again as
        GPX without the points inside it. A track of another trip answers `404`.
      operationId: getSharedTrackFile
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/TrackID"
      responses:
        "200":
          $ref: "#/components/responses/TrackFile"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shared/media/{mediaID}/thumbnail:
    get:
      tags: [Sharing]
      summary: Read a shared preview
      description: The preview of a file the link opens, under the same rules as the file itself.
      operationId: getSharedMediaThumbnail
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/MediaID"
        - $ref: "#/components/parameters/PreviewSize"
      responses:
        "200":
          description: The preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The browser's copy is still current.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/trips/{tripID}/budget:
    get:
      tags: [Budget]
      summary: Read the trip's budget
      description: |
        The totals, the breakdown by category and by day, and every individual
        cost of the trip's document. A plan counts what it commits to; a report
        counts the planned amounts it carries and what was really spent beside
        them, read from the report alone.
      operationId: getBudget
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          $ref: "#/components/responses/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripID}/reports:
    post:
      tags: [Trips]
      summary: Write a report from a plan
      description: |
        Creates a new report trip owned by the reader, who needs only to be able
        to read the plan. The plan's title, summary, dates, time zone, currency,
        travellers and budget are copied, and so is its content: the days, the
        places put in them, the stays, the legs with their calculations, the
        separate expenses and every planned amount, each copy remembering the row
        it came from. The plan's unassigned places, members, links and pictures
        are not copied.

        From then on the two are independent trips: editing or deleting the plan
        never moves a figure of the report. A trip that is itself a report
        answers `409 not_a_plan`.
      operationId: createReportFromPlan
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "201":
          description: The new report trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/StorageQuota"

  /api/v1/trips/{tripID}/plan/pdf:
    get:
      tags: [Documents]
      summary: Download the plan as a PDF
      description: |
        The plan as an A4 document to take on the way, read on a phone or
        printed: a cover whose list of days links to their pages; the stays
        with their dates, times of the desk, bookings and contacts, and the
        flights and transfers; the map of the trip; then a page a day with its
        map, when it starts and ends, and every place in the order it is
        reached - its time, how long it takes, where it is and what it costs -
        with the journeys between them; and last the ideas without a day.
        Every place and stay with a position carries a QR code, and its
        address a link, that open the way there in a map. It is written in the
        reader's language and units. Every member may. Like every PDF, it shows
        nothing inside the home of anybody on the trip (`/me/home`).
      operationId: getPlanPDF
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200":
          $ref: "#/components/responses/ReportPDF"
