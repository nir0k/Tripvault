# Serves the SPA and proxies the API to the backend, so the browser sees one
# origin and no CORS configuration is needed.

# Keep the public scheme supplied by an outer TLS proxy. Direct requests have
# no such header and use this nginx listener's own scheme.
map $http_x_forwarded_proto $tripvault_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

upstream tripvault_api {
    server ${TRIPVAULT_API_UPSTREAM};
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Behind a further proxy or a tunnel every request arrives from that proxy,
    # and the backend, which counts sign-in attempts per client, would count
    # every visitor as one. TRIPVAULT_TRUSTED_PROXY names the proxy's address or
    # network; the client is then read from X-Forwarded-For, skipping trusted
    # hops from the right, so an address a client wrote there itself is never
    # believed. The default trusts nobody real.
    set_real_ip_from ${TRIPVAULT_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The backend applies the configured upload limits, which the operator sets
    # and nginx does not know; a cap here would only disagree with them.
    client_max_body_size 0;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Everything the interface loads comes from this origin, except map tiles:
    # their server is chosen by TRIPVAULT_MAP_TILE_URL on the backend, so images
    # may come from any https origin. Scripts, styles and requests may not.
    #
    # A tile server of one's own usually runs on plain http inside a household
    # network, which that rule refuses. TRIPVAULT_MAP_TILE_ORIGIN names such a
    # server - one origin, for images only - and is empty in every deployment
    # that does not have one.
    #
    # Security headers are set per location rather than here: an add_header in
    # a location discards the server's, and the proxied API sets its own.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: ${TRIPVAULT_MAP_TILE_ORIGIN}; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # The API, the probes and the API reference live on the backend, which
    # sets its own headers. The dot is escaped so the pattern cannot capture
    # neighbouring paths.
    location ~ ^/(api|healthz|readyz|version|docs|openapi\.yaml)(/|$) {
        proxy_pass http://tripvault_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tripvault_forwarded_proto;
        proxy_set_header X-Request-Id      $request_id;
        # The longest waits are a report's PDF (five minutes) and an upload from
        # a slow connection (ten). Archives never pass through here.
        proxy_send_timeout 15m;
        proxy_read_timeout 15m;
        proxy_request_buffering off;
    }

    # Hashed file names never change, so they are cached for a year.
    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point,
    # which is always revalidated so a new release is picked up at once.
    #
    # Nothing here belongs in a search index: this is one household's private
    # service, and /s serves trips behind links handed out in confidence. The
    # header covers crawlers that never run the page's scripts, which a meta tag
    # added by the application would not reach.
    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
